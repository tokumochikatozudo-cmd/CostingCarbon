[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

# ── Redirects ───────────────────────────────────────────────────────────────
# 1. Force www → non-www canonical domain
[[redirects]]
  from = "https://www.phantommaestro.id/*"
  to   = "https://phantommaestro.id/:splat"
  status = 301
  force  = true

# 2. SPA catch-all: any path on phantommaestro.id that isn't a real file
#    must serve index.html so Auth0 ?code= callback and deep links work
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200



[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/*.glb"
  [headers.values]
    Content-Type = "model/gltf-binary"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Content-Type = "video/mp4"
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Content-Type = "image/jpeg"
    Cache-Control = "public, max-age=31536000"
