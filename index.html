  <style>
    #global-loader {
      position: fixed; inset: 0; z-index: 99999;
      background: #01020a; display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', monospace; transition: opacity 0.8s ease;
    }
    .loader-bg {
      position: absolute; inset: 0;
      background: radial-gradient(circle at center, rgba(34,197,94,0.1) 0%, transparent 70%);
    }
    .loader-content {
      position: relative; z-index: 2; width: 400px; max-width: 90%;
    }
    .tesseract {
      width: 50px; height: 50px; margin: 0 auto 35px;
      position: relative; transform-style: preserve-3d;
      animation: rotate-tesseract var(--hyper-speed, 3s) linear infinite;
    }
    .cube {
      position: absolute; inset: 0; transform-style: preserve-3d;
    }
    .cube-inner { transform: scale3d(0.5, 0.5, 0.5); }
    .face {
      position: absolute; width: 50px; height: 50px;
      border: 1.5px solid rgba(34,197,94,0.8);

      background: rgba(34,197,94,0.05);

    .face.front  { transform: translateZ(25px); }
    .face.back   { transform: rotateY(180deg) translateZ(25px); }
    .face.right  { transform: rotateY(90deg) translateZ(25px); }
    .face.left   { transform: rotateY(-90deg) translateZ(25px); }
    .face.top    { transform: rotateX(90deg) translateZ(25px); }
    .face.bottom { transform: rotateX(-90deg) translateZ(25px); }
    @keyframes rotate-tesseract {
      0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
      100% { transform: rotateX(360deg) rotateY(720deg) rotateZ(360deg); }
    }

  <script>
    window.startGlobalLoader = () => {
      // ── Speed: default slow (4s), fast if good connection ────────────────
      let baseSpeed = 4.5; // slow default
      if (navigator.connection) {
        const dl = navigator.connection.downlink || 0;
        const rtt = navigator.connection.rtt || 200;
        if (dl > 10 || rtt < 50)       baseSpeed = 1.8; // very fast
        else if (dl > 4 || rtt < 100)  baseSpeed = 2.8; // fast
        else if (dl > 1 || rtt < 200)  baseSpeed = 3.6; // medium
        // else stays at 4.5 — slow
      }
      document.documentElement.style.setProperty('--hyper-speed', baseSpeed + 's');

      const loader = document.getElementById('global-loader');
      if (loader) loader.style.display = 'flex';

      const term = document.getElementById('loader-term-text');
      const bar  = document.getElementById('loader-bar');

      const steps = [
        "> INITIALIZING GAIA PROTOCOL...",
        "> AUTHENTICATING USER SESSION...",
        "> LOADING CARBON ASSET DATABASE...",
        "> MOUNTING THREE.JS EARTH RENDERER...",
        "> CALIBRATING ATMOSPHERIC MODEL...",
        "> SYNCING USER CARBON LEDGER...",
        "> DEPLOYING MOLECULAR VISUALIZER...",
        "> SYSTEM READY. BOOTING COSTINGCARBON..."
      ];

      let stepIdx = 0;
      let progress = 0;
      let resolved = false;
      if (term) term.innerHTML = '';
      if (bar)  bar.style.width = '0%';

      // ── Track real resource loading ───────────────────────────────────────
      let resourcesLoaded = 0;
      const totalResources = 4; // Three.js, GLTFLoader, Auth0, Supabase
      const checkReady = () => {
        resourcesLoaded++;
        const frac = resourcesLoaded / totalResources;
        // Advance bar in real-load phase (0% – 65%)
        setBarTo(Math.max(progress, frac * 65));
      };

      // Listen for each CDN script to load
      ['three.min.js','GLTFLoader.js','auth0-spa-js','supabase-js'].forEach(name => {
        const existing = Array.from(document.scripts).find(s => s.src && s.src.includes(name));
        if (existing && existing.readyState !== 'loading') { checkReady(); return; }
        if (existing) existing.addEventListener('load', checkReady, { once: true });
        else checkReady(); // already loaded
      });

      function setBarTo(val) {
        progress = Math.min(99, Math.max(progress, val));
        if (bar) bar.style.width = progress + '%';
      }

      // Step text: paced so it fills the actual loading time
      const stepMs = (baseSpeed * 1000 * 0.9) / steps.length;
      const interval = setInterval(() => {
        if (stepIdx < steps.length && term) {
          term.innerHTML += steps[stepIdx] + '<br>';
          stepIdx++;
          setBarTo(progress + (stepIdx / steps.length) * 30);
        }
      }, Math.max(300, stepMs));

      // ── Resolve: called by app when it's actually ready ───────────────────
      let resolveLoader;
      const loaderPromise = new Promise(r => { resolveLoader = r; });

      window._resolveGaiaLoader = () => {
        if (resolved) return;
        resolved = true;
        clearInterval(interval);
        setBarTo(100);
        if (bar) bar.style.width = '100%';
        // Speed up hypercube to celebrate
        document.documentElement.style.setProperty('--hyper-speed', '0.9s');
        setTimeout(() => resolveLoader(), 500);
      };

      // Fallback: if app never calls _resolveGaiaLoader, auto-resolve after 12s max
      setTimeout(() => { if (!resolved) window._resolveGaiaLoader(); }, 12000);

      return loaderPromise;
    };

    window.removeGlobalLoader = () => {
      const loader = document.getElementById('global-loader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 800);
      }
    };
  </script>

  <script>

    const CAM_REST = { z: 6.5, y: 0.00, fov: 52 };

    // ═══ shaders.js ═══
    // ═══════════════════════════════════════════════════════════════════════════════
    //  GLSL SHADERS  — used for atmosphere glow and orb glow effects
    // ═══════════════════════════════════════════════════════════════════════════════

    const GLOW_V = `
  varying vec3 vNorm;
  void main(){
    vNorm = normalize(normalMatrix * normal);
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
  }
`;

    const GLOW_F = `
  uniform vec3  glowColor;
  uniform float coeff;
  uniform float power;
  varying vec3  vNorm;
  void main(){
    float intensity = coeff * pow(1.0 - abs(dot(vNorm, vec3(0.0,0.0,1.0))), power);
    gl_FragColor = vec4(glowColor * intensity, intensity);
  }
`;


    // ═══ helpers.js ═══
    // ═══════════════════════════════════════════════════════════════════════════════
    //  MATH HELPERS
    // ═══════════════════════════════════════════════════════════════════════════════
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    const easeO3 = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
    const easeO5 = t => 1 - Math.pow(1 - clamp(t, 0, 1), 5);
    const easeIO = t => {
      const c = clamp(t, 0, 1);
      return c < 0.5 ? 2 * c * c : 1 - Math.pow(-2 * c + 2, 2) / 2;
    };

    // ═══════════════════════════════════════════════════════════════════════════════

    const fmtKg = v => v >= 1 ? `${v.toFixed(2)} kg` : `${(v * 1000).toFixed(0)} g`;

    // Returns a THREE.Color (white → amber → red) based on fraction 0..1
    function co2ThreeColor(f) {
      const t = clamp(f, 0, 1);
      return t < 0.5
        ? new THREE.Color(1, lerp(1, 0.55, t * 2), lerp(1, 0.08, t * 2))
        : new THREE.Color(1, lerp(0.55, 0.04, (t - 0.5) * 2), 0);
    }

    // Returns a CSS hex string for use in HTML/SVG elements
    function co2HexColor(f) {
      const t = clamp(f, 0, 1);
      if (t < 0.30) return "#ffffff";
      if (t < 0.55) return "#ffcc44";
      if (t < 0.80) return "#ff6600";
      return "#ff1a1a";

    // Renders an emoji centred on a canvas and returns it as a THREE.CanvasTexture
    function makeEmojiTex(emoji, size = 128) {
      const c = document.createElement("canvas");
      c.width = c.height = size;
      const x = c.getContext("2d");
      x.clearRect(0, 0, size, size);
      x.font = `${size * 0.76}px serif`;
      x.textAlign = "center";
      x.textBaseline = "middle";
      x.fillText(emoji, size / 2, size / 2 + 3);
      return new THREE.CanvasTexture(c);

    // Procedural Earth surface — ocean gradient + continent polygons + terrain noise
    function makeEarthTex() {
      const c = document.createElement("canvas"); c.width = 2048; c.height = 1024;
      const x = c.getContext("2d");

      const g = x.createLinearGradient(0, 0, 0, 1024);
      g.addColorStop(0, "#0e4a80");
      g.addColorStop(0.5, "#1565a8");

      // Continent polygons (approximate)

      [

        [[1500, 330], [1600, 320], [1650, 380], [1620, 440], [1545, 450], [1490, 400]],
        [[1595, 515], [1715, 485], [1775, 525], [1785, 605], [1735, 655], [1635, 655], [1575, 605], [1565, 545]],
      ].forEach(pts => {
        x.beginPath();
        x.moveTo(pts[0][0] * 1.18, pts[0][1] * 1.06);
        pts.slice(1).forEach(p => x.lineTo(p[0] * 1.18, p[1] * 1.06));
        x.closePath(); x.fill();
      });

      // Terrain noise overlay
      for (let i = 0; i < 1600; i++) {
        x.fillStyle = `rgba(${35 + Math.random() * 50 | 0},${65 + Math.random() * 70 | 0},${10 + Math.random() * 30 | 0},${Math.random() * 0.4})`;
        x.beginPath();
        x.arc(Math.random() * 2048, Math.random() * 1024, Math.random() * 4 + 0.5, 0, Math.PI * 2);
        x.fill();
      }
      return new THREE.CanvasTexture(c);
    }

    // Procedural cloud layer — soft elliptical blobs
    function makeCloudTex() {
      const c = document.createElement("canvas"); c.width = 1024; c.height = 512;
      const x = c.getContext("2d");
      for (let i = 0; i < 90; i++) {
        const px = Math.random() * 1024, py = Math.random() * 512;
        const rx = Math.random() * 72 + 18, ry = Math.random() * 20 + 7;
        const g = x.createRadialGradient(px, py, 0, px, py, Math.max(rx, ry));
        g.addColorStop(0, "rgba(255,255,255,.6)");
        g.addColorStop(1, "rgba(255,255,255,0)");
        x.fillStyle = g;
        x.beginPath();
        x.ellipse(px, py, rx, ry, Math.random() * Math.PI, 0, Math.PI * 2);
        x.fill();
      }
      return new THREE.CanvasTexture(c);
    }

    // Procedural night-lights layer — city glow clusters
    function makeNightTex() {
      const c = document.createElement("canvas"); c.width = 1024; c.height = 512;
      const x = c.getContext("2d");
      x.fillStyle = "#000"; x.fillRect(0, 0, 1024, 512);
      [[200, 175, 80], [490, 195, 70], [680, 175, 130], [480, 335, 60], [245, 375, 50], [760, 365, 50]]
        .forEach(([cx, cy, sp]) => {
          for (let i = 0; i < 140; i++) {
            x.fillStyle = `rgba(255,${220 + Math.random() * 35 | 0},${130 + Math.random() * 80 | 0},${Math.random() * 0.9})`;
            x.fillRect(
              (cx + (Math.random() - 0.5) * sp * 2.4) * 1.18,
              (cy + (Math.random() - 0.5) * sp) * 1.06,
              1, 1
            );
          }
        });
      return new THREE.CanvasTexture(c);
    }

    // Procedural galaxy background — olive nebula, star cluster, blue-purple accent
    function makeGalaxyTex() {
      const W = 2048, H = 1024;
      const c = document.createElement("canvas"); c.width = W; c.height = H;
      const x = c.getContext("2d");
      x.fillStyle = "#01020a"; x.fillRect(0, 0, W, H);

      // Nebula layers
      [
        [.45, .46, .40, .28, .10, "78,88,34", .24],
        [.50, .42, .28, .18, .20, "98,83,28", .19],
        [.38, .55, .22, .14, -.15, "53,73,18", .16],
        [.62, .50, .18, .12, .30, "88,78,26", .15],
        [.25, .40, .18, .12, -.20, "38,58,16", .13],
        [.72, .45, .16, .10, .10, "58,53,20", .12],
        [.48, .60, .32, .15, .00, "48,38,10", .17],
      ].forEach(([cx, cy, rx, ry, rot, rgb, a]) => {
        x.save(); x.translate(cx * W, cy * H); x.rotate(rot);
        const g = x.createRadialGradient(0, 0, 0, 0, 0, Math.max(rx * W, ry * H));
        g.addColorStop(0, `rgba(${rgb},${a})`);
        g.addColorStop(0.45, `rgba(${rgb},${a * 0.5})`);
        g.addColorStop(1, `rgba(${rgb},0)`);
        x.fillStyle = g; x.scale(1, ry / rx);
        x.beginPath(); x.arc(0, 0, rx * W, 0, Math.PI * 2); x.fill();
        x.restore();
      });

      // Bright central star cluster
      const sc = x.createRadialGradient(W * .46, H * .34, 0, W * .46, H * .34, W * .10);
      sc.addColorStop(0, "rgba(255,255,240,.60)");
      sc.addColorStop(0.25, "rgba(255,240,180,.30)");
      sc.addColorStop(0.65, "rgba(200,180,100,.10)");
      sc.addColorStop(1, "rgba(0,0,0,0)");
      x.fillStyle = sc; x.fillRect(0, 0, W, H);

      // Purple-blue accent nebula
      const pg = x.createRadialGradient(W * .60, H * .38, 0, W * .60, H * .38, W * .09);
      pg.addColorStop(0, "rgba(120,100,255,.40)");
      pg.addColorStop(0.45, "rgba(80,60,200,.20)");
      pg.addColorStop(1, "rgba(0,0,0,0)");
      x.fillStyle = pg; x.fillRect(0, 0, W, H);

      // Inner haze
      const hz = x.createRadialGradient(W * .47, H * .38, 0, W * .47, H * .38, W * .24);
      hz.addColorStop(0, "rgba(155,135,55,.15)");
      hz.addColorStop(1, "rgba(0,0,0,0)");
      x.fillStyle = hz; x.fillRect(0, 0, W, H);

      // Stars
      const pal = [
        "rgba(255,255,255,", "rgba(220,230,255,", "rgba(255,240,200,",
        "rgba(255,200,150,", "rgba(180,200,255,", "rgba(255,160,120,",
      ];
      for (let i = 0; i < 15000; i++) {
        const sx = Math.random() * W, sy = Math.random() * H, r = Math.random();
        const sz = r < .90 ? Math.random() * .55 + .15
          : r < .97 ? Math.random() * 1.1 + .7
            : Math.random() * 2.4 + 1.5;
        const col = pal[Math.floor(Math.random() * pal.length)];
        const bri = (0.35 + Math.random() * 0.65).toFixed(2);
        if (sz > 1.4) {
          const gl = x.createRadialGradient(sx, sy, 0, sx, sy, sz * 3.8);
          gl.addColorStop(0, `${col}${Math.min(1, parseFloat(bri) * 1.3).toFixed(2)})`);
          gl.addColorStop(1, `${col}0)`);
          x.fillStyle = gl;
          x.beginPath(); x.arc(sx, sy, sz * 3.8, 0, Math.PI * 2); x.fill();
        }
        x.fillStyle = `${col}${bri})`;
        x.beginPath(); x.arc(sx, sy, sz, 0, Math.PI * 2); x.fill();
      }

      // Bright coloured foreground stars
      [
        [W * .18, H * .38, 2.8, "255,200,80"], [W * .28, H * .28, 2.2, "255,220,100"],
        [W * .82, H * .30, 2.5, "255,180,80"], [W * .12, H * .65, 2.0, "240,160,60"],
        [W * .90, H * .52, 1.8, "200,180,255"], [W * .55, H * .70, 1.5, "255,100,100"],
      ].forEach(([sx, sy, sr, rgb]) => {
        const gl = x.createRadialGradient(sx, sy, 0, sx, sy, sr * 6.5);
        gl.addColorStop(0, `rgba(${rgb},.95)`);
        gl.addColorStop(.3, `rgba(${rgb},.4)`);
        gl.addColorStop(1, `rgba(${rgb},0)`);
        x.fillStyle = gl; x.beginPath(); x.arc(sx, sy, sr * 6.5, 0, Math.PI * 2); x.fill();
        x.fillStyle = `rgba(${rgb},1)`; x.beginPath(); x.arc(sx, sy, sr, 0, Math.PI * 2); x.fill();
      });

      return new THREE.CanvasTexture(c);
    }


    // ═══ EarthScene.js ═══
    // ═══════════════════════════════════════════════════════════════════════════════
    //  EARTH SCENE  — plain JS factory function, no React
    //  Usage: const scene = createEarthScene(mountEl, { onPanelOpen });
    //         scene.updateCarbonFrac(0.57);
    //         scene.reset();
    //         scene.destroy();
    // ═══════════════════════════════════════════════════════════════════════════════
    function createEarthScene(mountEl, { onPanelOpen } = {}) {
      mountEl.style.position = 'relative';
      mountEl.style.userSelect = 'none';

      // ── Black cinematic fade overlay (was fadeRef in React) ────────────────────
      const fadeEl = document.createElement('div');
      fadeEl.style.cssText = 'position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:8;transition:opacity .04s linear;';
      mountEl.appendChild(fadeEl);

      // ── Vignette for drama ─────────────────────────────────────────────────────
      const vigEl = document.createElement('div');
      vigEl.style.cssText = "position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.55) 100%);pointer-events:none;z-index:3;";
      mountEl.appendChild(vigEl);

      // W/H: clientWidth triggers a reflow and returns correct value, but we
      // guard with window.innerWidth as a safety net on first paint.
      let W = mountEl.clientWidth || window.innerWidth;
      let H = mountEl.clientHeight || window.innerHeight;
      let rafId = null;
      let currentCarbonFrac = 0;

      // ── Camera FSM state (was cam.current ref) ─────────────────────────────────
      const cam = {
        phase: "rest", progress: 0,
        startPos: new THREE.Vector3(0, 0, CAM_REST.z),
        targetPos: new THREE.Vector3(0, 0, CAM_OPEN.z),
        startFov: CAM_REST.fov,
        lookStart: new THREE.Vector3(),
        lookTarget: new THREE.Vector3(),
        lookCurrent: new THREE.Vector3(),
        panelFired: false,
        pendingId: null,
      };

      // ── Drag & mouse state ─────────────────────────────────────────────────────
      const drag = { active: false, delta: { x: 0, y: 0 }, start: { x: 0, y: 0 }, mouseNorm: { x: 0, y: 0 } };
      let autoRot = true;

      // ── Per-orb physics (was orbPhys.current) ──────────────────────────────────
      const orbPhys = ZONES.map(() => ({
        pos: new THREE.Vector3(),
        vel: new THREE.Vector3(),
        targetPos: new THREE.Vector3(),
        phase: "hidden",
        spawnT: 0, popT: 1,
        scale: 0, opacity: 0, delay: 0,
        breatheT: Math.random() * Math.PI * 2,
        breatheSpd: 0.007 + Math.random() * 0.005,
        breathe: 1.0,
        retractT: 0,
        retractStart: new THREE.Vector3(),
        retractTarget: new THREE.Vector3(),
      }));

      // ── Renderer ───────────────────────────────────────────────────────────────
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(W, H);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setClearColor(0x000000, 0);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.65;
      mountEl.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(CAM_REST.fov, W / H, 0.05, 1000);
      camera.position.set(0, 0, CAM_REST.z);

      // ── Galaxy skybox ──────────────────────────────────────────────────────────
      // Galaxy skybox replaced by MP4 video
      const galaxySphere = new THREE.Mesh(
        new THREE.SphereGeometry(500, 64, 64),
        new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.BackSide })
      );
      galaxySphere.visible = false;
      scene.add(galaxySphere);



      // ── Earth ──────────────────────────────────────────────────────────────────
      const earthGroup = new THREE.Group(); scene.add(earthGroup);
      const earthMat = new THREE.MeshPhongMaterial({
        map: makeEarthTex(), specular: new THREE.Color(0x000000), shininess: 0, bumpScale: .08,
      });
      const earthMesh = new THREE.Mesh(new THREE.SphereGeometry(2, 80, 80), earthMat);
      earthGroup.add(earthMesh);

      const tl = new THREE.TextureLoader(); tl.crossOrigin = "anonymous";
      tl.load(TEX.earthDay, t => { earthMat.map = t; earthMat.needsUpdate = true; }, undefined, () => { });
      tl.load(TEX.earthNormal, t => { earthMat.bumpMap = t; earthMat.needsUpdate = true; }, undefined, () => { });

      // Cloud mesh removed — no cloud texture

      const nightMesh = new THREE.Mesh(
        new THREE.SphereGeometry(2.008, 60, 60),
        new THREE.MeshLambertMaterial({ map: makeNightTex(), blending: THREE.AdditiveBlending, transparent: true, opacity: .28, depthWrite: false })
      );
      tl.load(TEX.earthNight, t => { nightMesh.material.map = t; nightMesh.material.needsUpdate = true; }, undefined, () => { });
      earthGroup.add(nightMesh);

      // ── Atmosphere — CO₂ colour indicator ─────────────────────────────────────
      const initC = co2ThreeColor(0);
      const atmosMat = new THREE.ShaderMaterial({
        vertexShader: GLOW_V, fragmentShader: GLOW_F,
        uniforms: { glowColor: { value: initC.clone() }, coeff: { value: 0.72 }, power: { value: 3.2 } },
        transparent: true, side: THREE.BackSide, blending: THREE.AdditiveBlending, depthWrite: false,
      });
      scene.add(new THREE.Mesh(new THREE.SphereGeometry(2.58, 48, 48), atmosMat));

      const rimMat = new THREE.ShaderMaterial({
        vertexShader: GLOW_V, fragmentShader: GLOW_F,
        uniforms: { glowColor: { value: initC.clone().multiplyScalar(.55) }, coeff: { value: .42 }, power: { value: 5.0 } },
        transparent: true, side: THREE.FrontSide, blending: THREE.AdditiveBlending, depthWrite: false,
      });
      scene.add(new THREE.Mesh(new THREE.SphereGeometry(2.02, 48, 48), rimMat));

      // ── Lighting ───────────────────────────────────────────────────────────────
      scene.add(new THREE.AmbientLight(0x224466, 2.2));
      const hr = new Date().getUTCHours(), sunA = ((hr + 12) / 24) * Math.PI * 2;
      const sunLight = new THREE.DirectionalLight(0xfff2d0, 2.2);
      sunLight.position.set(Math.cos(sunA) * 14, 3.5, Math.sin(sunA) * 14);
      sunLight.castShadow = true; scene.add(sunLight);
      const fillLight = new THREE.DirectionalLight(0x3366bb, 1.4);
      fillLight.position.set(-8, 2, -8); scene.add(fillLight);
      const rimLight = new THREE.PointLight(0x55aaff, 1.4, 20);
      rimLight.position.set(6, 3, 4); scene.add(rimLight);

      // ── Geolocation marker ─────────────────────────────────────────────────────
      const locDot = new THREE.Mesh(
        new THREE.SphereGeometry(.075, 8, 8),
        new THREE.MeshPhongMaterial({ color: 0xff3333, emissive: 0xff1111, emissiveIntensity: 2.0 })
      );
      locDot.visible = false; earthGroup.add(locDot);

      const pulseRing = new THREE.Mesh(
        new THREE.TorusGeometry(.14, .013, 6, 24),
        new THREE.MeshBasicMaterial({ color: 0xff4444, transparent: true, opacity: .8 })
      );
      pulseRing.visible = false; earthGroup.add(pulseRing);

      function flyTo(lat, lon) {
        const ph = (90 - lat) * (Math.PI / 180), th = (lon + 180) * (Math.PI / 180), r = 2.09;
        locDot.position.set(-r * Math.sin(ph) * Math.cos(th), r * Math.cos(ph), r * Math.sin(ph) * Math.sin(th));
        pulseRing.position.copy(locDot.position); pulseRing.lookAt(0, 0, 0);
        locDot.visible = true; pulseRing.visible = true;
      }
      navigator.geolocation?.getCurrentPosition(
        p => flyTo(p.coords.latitude, p.coords.longitude),
        async () => {
          try {
            const d = await (await fetch("https://ipapi.co/json/")).json();
            if (d.latitude) flyTo(d.latitude, d.longitude);
          } catch { }
        },
        { timeout: 5000 }
      );

      // ── 3-D Orb objects ────────────────────────────────────────────────────────
      const orbObjects = ZONES.map(zone => {
        const group = new THREE.Group(); group.visible = false; scene.add(group);

        const coreMat = new THREE.MeshPhongMaterial({
          color: zone.threeCol,
          emissive: new THREE.Color(zone.threeCol).multiplyScalar(0.25),
          emissiveIntensity: 1.0, shininess: 130,
          specular: new THREE.Color(0xffffff),
          transparent: true, opacity: 1,
        });
        const core = new THREE.Mesh(zone.makeGeo(), coreMat);
        group.add(core);

        const glowMat = new THREE.ShaderMaterial({
          vertexShader: GLOW_V, fragmentShader: GLOW_F,
          uniforms: { glowColor: { value: new THREE.Color(zone.threeCol) }, coeff: { value: 0 }, power: { value: zone.glowPow } },
          transparent: true, side: THREE.BackSide, blending: THREE.AdditiveBlending, depthWrite: false,
        });
        const glowMesh = new THREE.Mesh(new THREE.SphereGeometry(.72, 16, 16), glowMat);
        group.add(glowMesh);

        const innerGlowMat = new THREE.ShaderMaterial({
          vertexShader: GLOW_V, fragmentShader: GLOW_F,
          uniforms: {
            glowColor: { value: new THREE.Color(zone.threeCol).multiplyScalar(0.7) },
            coeff: { value: 0 }, power: { value: zone.glowPow * 1.8 },
          },
          transparent: true, side: THREE.FrontSide, blending: THREE.AdditiveBlending, depthWrite: false,
        });
        const innerGlowMesh = new THREE.Mesh(new THREE.SphereGeometry(.34, 16, 16), innerGlowMat);
        innerGlowMesh.visible = false; // inner bubble removed
        group.add(innerGlowMesh);

        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
          map: makeEmojiTex(zone.icon, 160), transparent: true, depthTest: false, opacity: 1,
        }));
        sprite.scale.set(.42, .42, .42);
        group.add(sprite);

        const ptLight = new THREE.PointLight(zone.threeCol, 0, 2.2); // short range — won't reach Earth
        group.add(ptLight);

        let ring = null;
        if (zone.hasRing) {
          // Community orb: hide geometry — replaced by GLTF castle model
          core.visible = false;   // invisible but kept for raycasting
          sprite.visible = false;   // emoji hidden
          // No ring — castle model is the visual
        }

        return { group, core, coreMat, glowMat, innerGlowMat, glowMesh, innerGlowMesh, sprite, ptLight, ring };
      });

      // ── HTML label overlay ─────────────────────────────────────────────────────
      const labelDiv = document.createElement("div");
      labelDiv.style.cssText = "position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden;";
      mountEl.appendChild(labelDiv);

      // ── Castle GLTF orb (community zone) ────────────────────────────────────
      const COMMUNITY_IDX = ZONES.findIndex(z => z.id === "community");
      let castleModel = null;   // THREE.Group — set once GLTFLoader finishes
      let castleMixer = null;   // AnimationMixer for built-in animation
      let castleLoaded = false;

      const gltfLoader = new THREE.GLTFLoader();
      gltfLoader.load(
        'castle.glb',
        (gltf) => {
          castleModel = gltf.scene;

          // ── Step 1: add to scene temporarily so matrix math is valid ────────
          scene.add(castleModel);
          castleModel.updateMatrixWorld(true);

          // ── Step 2: measure world bounding box ───────────────────────────────
          const box0 = new THREE.Box3().setFromObject(castleModel);
          const size0 = box0.getSize(new THREE.Vector3());
          const maxDim = Math.max(size0.x, size0.y, size0.z);
          const centre0 = box0.getCenter(new THREE.Vector3());

          // ── Step 3: remove from scene — will attach to orb group ─────────────
          scene.remove(castleModel);

          // ── Step 4: centre pivot & scale ─────────────────────────────────────
          const targetSize = 0.95;
          castleModel.position.set(
            -centre0.x * (targetSize / maxDim),
            -centre0.y * (targetSize / maxDim),
            -centre0.z * (targetSize / maxDim)
          );
          castleModel.scale.setScalar(targetSize / maxDim);

          // ── Step 5: tilt for a nice floating angle ───────────────────────────
          castleModel.rotation.x = 0.18;
          castleModel.rotation.y = Math.PI * 0.25;

          // ── Step 5: emissive boost — model has emissive maps, just amplify ───
          castleModel.traverse(child => {
            if (child.isMesh) {
              child.castShadow = false;
              child.receiveShadow = false;
              const mats = Array.isArray(child.material) ? child.material : [child.material];
              mats.forEach(m => {
                if (m.emissiveMap) m.emissiveIntensity = 1.8;  // boost emissive maps
                m.transparent = true;
                m.needsUpdate = true;
              });
            }
          });

          // ── Step 6: no animations in castle — rotation handled in loop

          // ── Step 7: attach to community orb group ───────────────────────────
          orbObjects[COMMUNITY_IDX].group.add(castleModel);
          castleLoaded = true;
          console.log('Castle loaded ✓', { maxDim, scale: targetSize / maxDim });
        },
        (xhr) => {
          if (xhr.total) console.log('Castle ' + Math.round(xhr.loaded / xhr.total * 100) + '%');
        },
        (err) => {
          console.error('GLB load error:', err);
          // Fallback — restore visible sphere so orb is never empty
          const commObj = orbObjects[COMMUNITY_IDX];
          commObj.core.visible = true;
          commObj.sprite.visible = true;
        }
      );

      // ── Sakura GLTF orb (dashboard zone) ─────────────────────────────────────
      const DASHBOARD_IDX = ZONES.findIndex(z => z.id === "dashboard");
      let sakuraModel = null;

        'sakura.glb',

          // Step 1: add to scene so matrix is computed
          scene.add(sakuraModel);
          sakuraModel.updateMatrixWorld(true);

          // Step 2: measure
          const sBox = new THREE.Box3().setFromObject(sakuraModel);
          const sSize = sBox.getSize(new THREE.Vector3());
          const sMaxDim = Math.max(sSize.x, sSize.y, sSize.z);
          const sCentre = sBox.getCenter(new THREE.Vector3());

          // Step 3: remove, then centre + scale
          scene.remove(sakuraModel);
          sakuraModel.position.set(
            -sCentre.x * (0.95 / sMaxDim),
            -sCentre.y * (0.95 / sMaxDim),
            -sCentre.z * (0.95 / sMaxDim)
          );
          sakuraModel.scale.setScalar(0.95 / sMaxDim);

          // Step 4: tilt for floating feel
          sakuraModel.rotation.x = 0.15;
          sakuraModel.rotation.y = Math.PI * 0.3;

          // Step 5: emissive boost so it glows in dark space
          sakuraModel.traverse(child => {
            if (child.isMesh) {
              child.castShadow = false; child.receiveShadow = false;
              const mats = Array.isArray(child.material) ? child.material : [child.material];
              mats.forEach(m => {
                m.emissive = m.emissive || new THREE.Color(0x331122);
                m.emissiveIntensity = 0.3;
                m.transparent = true;
                m.needsUpdate = true;
              });
            }
          });

          // Step 6: attach to dashboard orb group
          orbObjects[DASHBOARD_IDX].group.add(sakuraModel);
          // Hide the original diamond geometry + sprite
          orbObjects[DASHBOARD_IDX].core.visible = false;
          orbObjects[DASHBOARD_IDX].sprite.visible = false;
          sakuraLoaded = true;
          console.log('Sakura loaded ✓');
        },
        (xhr) => { if (xhr.total) console.log('Sakura ' + Math.round(xhr.loaded / xhr.total * 100) + '%'); },
        (err) => {
          console.error('Sakura load error:', err);
          // Fallback: restore original geometry
          orbObjects[DASHBOARD_IDX].core.visible = true;
          orbObjects[DASHBOARD_IDX].sprite.visible = true;
        }
      );


      // ── Crab GLTF orb (planner zone) ──────────────────────────────────────────
      const CRAB_IDX = ZONES.findIndex(z => z.id === "planner");
      let crabModel = null;
      let crabLoaded = false;

      const crabLoader = new THREE.GLTFLoader();
      crabLoader.load(
        'crab.glb',
        (gltf) => {
          crabModel = gltf.scene;
          scene.add(crabModel);
          crabModel.updateMatrixWorld(true);
          const b = new THREE.Box3().setFromObject(crabModel);
          const sz = b.getSize(new THREE.Vector3());

      // ── Chest GLTF orb (insights zone) ──────────────────────────────────────────

      // ── Ship GLTF orb (log zone) ──────────────────────────────────────────
      const SHIP_IDX = ZONES.findIndex(z => z.id === "log");

      const labelEls = ZONES.map(zone => {
        const el = document.createElement("div");
        el.className = "orb-label";
        el.style.cssText = "position:absolute;transform:translate(-50%,-145%);opacity:0;pointer-events:none;transition:opacity .25s ease;";
        el.innerHTML = `
      <div style="text-align:center;background:rgba(1,3,12,.85);border:1px solid ${zone.hex}45;border-radius:12px;
        padding:7px 15px 6px;font-family:'Syne',sans-serif;white-space:nowrap;backdrop-filter:blur(18px);
        box-shadow:0 0 22px ${zone.hex}30,inset 0 1px 0 rgba(255,255,255,.06);">
        <div style="font-size:10px;font-weight:700;color:${zone.hex};letter-spacing:2px;text-transform:uppercase">${zone.label}</div>

      </div>`;
        labelDiv.appendChild(el);
        return el;
      });

      // ── Hint text ──────────────────────────────────────────────────────────────
      const hintEl = document.createElement("div");
      hintEl.style.cssText = "position:absolute;bottom:52px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;transition:opacity .6s ease;font-family:'Syne',sans-serif;z-index:4;";
      hintEl.innerHTML = `
    <div style="font-size:11px;color:rgba(255,255,255,.38);letter-spacing:2.5px;text-transform:uppercase;">Click Earth to explore</div>
    <div style="font-size:14px;margin-top:5px;opacity:.35">◆</div>`;
      mountEl.appendChild(hintEl);

      // ── Raycaster ──────────────────────────────────────────────────────────────
      const raycaster = new THREE.Raycaster();
      const mouse2 = new THREE.Vector2();
      const getN = e => {
        const r = mountEl.getBoundingClientRect();
        return { x: ((e.clientX - r.left) / W) * 2 - 1, y: -((e.clientY - r.top) / H) * 2 + 1 };
      };

      // ── Pointer handlers ───────────────────────────────────────────────────────
      const onDown = e => {
        const ph = cam.phase;
        if (ph !== "rest" && ph !== "open") return;
        drag.active = true;
        drag.start = { x: e.clientX, y: e.clientY };
        drag.delta = { x: 0, y: 0 };
      };

      const onMove = e => {
        const n = getN(e); drag.mouseNorm = n;
        if (!drag.active) return;
        drag.delta = { x: e.clientX - drag.start.x, y: e.clientY - drag.start.y };
        earthGroup.rotation.y += (e.movementX || 0) * .006;
        earthGroup.rotation.x = Math.max(-1.1, Math.min(1.1, earthGroup.rotation.x + (e.movementY || 0) * .004));
        autoRot = false;
      };

      const onUp = e => {
        const wasDrag = Math.hypot(drag.delta.x, drag.delta.y) > 5;
        drag.active = false;
        if (wasDrag) return;

        const n = getN(e); mouse2.set(n.x, n.y); raycaster.setFromCamera(mouse2, camera);
        const ph = cam.phase;

        if (ph === "open") {
          const cores = orbObjects.map((o, i) => orbPhys[i].phase === "alive" ? o.core : null).filter(Boolean);
          const hits = raycaster.intersectObjects(cores);
          if (hits.length > 0) {
            const idx = orbObjects.findIndex(o => o.core === hits[0].object);
            if (idx >= 0) { triggerOrbZoom(idx); return; }
          }
        }

        if (ph === "rest" || ph === "open") {
          if (raycaster.intersectObject(earthMesh).length > 0) {
            if (ph === "rest") spawnOrbs();
            else retractOrbs();
          }
        }
      };

      renderer.domElement.addEventListener("pointerdown", onDown);
      renderer.domElement.addEventListener("pointermove", onMove);
      renderer.domElement.addEventListener("pointerup", onUp);
      renderer.domElement.style.cursor = "default";

      // ── Orb control functions ──────────────────────────────────────────────────
      function spawnOrbs() {
        cam.phase = "opening"; cam.progress = 0;
        cam.startPos = camera.position.clone(); cam.startFov = camera.fov;
        hintEl.style.opacity = "0";

        ZONES.forEach((_, i) => {
          const op = orbPhys[i];
          const baseAngle = (i / ZONES.length) * Math.PI * 2 + (Math.random() - .5) * .5;
          const phi = (.32 + Math.random() * .36) * Math.PI;
          const r = 3.9 + Math.random() * .6;
          const tp = new THREE.Vector3(
            r * Math.sin(phi) * Math.cos(baseAngle),
            r * Math.cos(phi) * .65,
            r * Math.sin(phi) * Math.sin(baseAngle) * .55 + 2.2
          );
          if (tp.z < 1.6) { tp.z = 1.6 + Math.random() * .8; }
          op.targetPos.copy(tp);
          op.pos.copy(tp.clone().normalize().multiplyScalar(2.05)); // start at Earth surface
          op.vel.set(0, 0, 0);
          op.phase = "spawning"; op.spawnT = 0; op.scale = 0; op.opacity = 0;
          op.delay = i * 14; // sequential — each follows the previous
          orbObjects[i].group.visible = true;
        });
      }

      function retractOrbs() {
        cam.phase = "closing"; cam.progress = 0;
        cam.startPos = camera.position.clone(); cam.startFov = camera.fov;
        ZONES.forEach((_, i) => {
          const op = orbPhys[i];
          if (op.phase === "alive" || op.phase === "spawning") {
            setTimeout(() => {
              if (op.phase === "alive" || op.phase === "spawning") {
                op.phase = "retracting";
                op.retractT = 0;
                op.retractStart.copy(op.pos);
                op.retractTarget.copy(op.pos).normalize().multiplyScalar(1.9);
                op.vel.set(0, 0, 0);
              }
            }, i * 90);
          }
        });
      }

      function triggerOrbZoom(idx) {
        const op = orbPhys[idx];
        const orbWorldPos = op.pos.clone();
        const camTgt = orbWorldPos.clone().normalize().multiplyScalar(4.2);

        ZONES.forEach((_, i) => {
          if (i !== idx) {
            const p2 = orbPhys[i];
            if (p2.phase === "alive") { p2.phase = "popping"; p2.popT = 1.0; }
          }
        });

        cam.phase = "zoomOrb"; cam.progress = 0;
        cam.startPos = camera.position.clone();
        cam.targetPos = camTgt;
        cam.startFov = camera.fov;
        cam.lookStart.set(0, 0, 0);
        cam.lookTarget.copy(orbWorldPos);
        cam.lookCurrent.set(0, 0, 0);
        cam.pendingId = ZONES[idx].id;
        cam.panelFired = false;
        hintEl.style.opacity = "0";
      }

      // ── Main animation loop ────────────────────────────────────────────────────
      let tick = 0;
      function animate() {
        rafId = requestAnimationFrame(animate);
        tick += .014;
        const c = cam;

        // Background drift
        // galaxySphere rotation off — hidden

        // Earth auto-rotation
        if (!drag.active && autoRot && (c.phase === "rest" || c.phase === "open")) {
          earthGroup.rotation.y += .00065;
        }
        // cloudMesh rotation removed

        // Pulse ring
        if (pulseRing.visible) {
          pulseRing.scale.setScalar(1 + Math.sin(tick * 2) * .4);
          pulseRing.material.opacity = .6 - Math.sin(tick * 2) * .3;
        }

        // ── Camera FSM ───────────────────────────────────────────────────────────
        if (c.phase === "rest") {
          camera.position.x = Math.sin(tick * .22) * .06;
          camera.position.y = Math.cos(tick * .18) * .04;
          camera.lookAt(0, 0, 0);
        }

        if (c.phase === "opening") {
          c.progress = Math.min(1, c.progress + .018);
          const e = easeO5(c.progress);
          camera.position.x = lerp(c.startPos.x, 0, e);
          camera.position.y = lerp(c.startPos.y, CAM_OPEN.y, e);
          camera.position.z = lerp(c.startPos.z, CAM_OPEN.z, e);
          camera.fov = lerp(c.startFov, CAM_OPEN.fov, e);
          camera.updateProjectionMatrix(); camera.lookAt(0, 0, 0);
          if (c.progress >= 1) { c.phase = "open"; }
        }

        if (c.phase === "open") {
          camera.position.x = Math.sin(tick * .14) * .10;
          camera.position.y = CAM_OPEN.y + Math.cos(tick * .11) * .06;
          camera.position.z = CAM_OPEN.z;
          camera.lookAt(0, 0, 0);
        }

        if (c.phase === "closing") {
          c.progress = Math.min(1, c.progress + .022);
          camera.position.x = lerp(camera.position.x, 0, .06);
          camera.position.y = lerp(camera.position.y, 0, .06);
          camera.position.z = lerp(camera.position.z, CAM_REST.z, .06);
          camera.fov = lerp(camera.fov, CAM_REST.fov, .08);
          camera.updateProjectionMatrix(); camera.lookAt(0, 0, 0);
          if (c.progress >= 1 && Math.abs(camera.position.z - CAM_REST.z) < .05) {
            c.phase = "rest";
            camera.position.set(0, 0, CAM_REST.z); camera.fov = CAM_REST.fov;
            camera.updateProjectionMatrix(); hintEl.style.opacity = "1";
          }
        }

        if (c.phase === "zoomOrb") {
          c.progress = Math.min(1, c.progress + .013);
          const e = easeIO(c.progress);
          camera.position.lerpVectors(c.startPos, c.targetPos, e);
          camera.fov = lerp(c.startFov, 9, e);
          camera.updateProjectionMatrix();
          c.lookCurrent.lerpVectors(c.lookStart, c.lookTarget, Math.min(1, e * 1.6));
          camera.lookAt(c.lookCurrent);
          const fStart = .52, fr = c.progress > fStart ? (c.progress - fStart) / (1 - fStart) : 0;
          fadeEl.style.opacity = fr.toFixed(3);
          if (c.progress >= .72 && !c.panelFired) {
            c.panelFired = true;
            if (c.pendingId && onPanelOpen) onPanelOpen(c.pendingId);
          }
          if (c.progress >= 1) c.phase = "zoomDone";
        }

        if (c.phase === "resetting") {
          c.progress = Math.min(1, c.progress + .022);
          const e = easeO3(c.progress);
          camera.position.lerp(new THREE.Vector3(0, 0, CAM_REST.z), e * .12 + .02);
          camera.fov = lerp(camera.fov, CAM_REST.fov, .08);
          camera.updateProjectionMatrix(); camera.lookAt(0, 0, 0);
          fadeEl.style.opacity = (1 - easeO3(c.progress * 1.3)).toFixed(3);
          if (camera.position.distanceTo(new THREE.Vector3(0, 0, CAM_REST.z)) < .06) {
            camera.position.set(0, 0, CAM_REST.z); camera.fov = CAM_REST.fov;
            camera.updateProjectionMatrix();
            fadeEl.style.opacity = "0";
            c.phase = "rest"; autoRot = true; hintEl.style.opacity = "1";
          }
        }

        // ── Cursor feedback ──────────────────────────────────────────────────────
        {
          const n = drag.mouseNorm;
          mouse2.set(n.x || 0, n.y || 0); raycaster.setFromCamera(mouse2, camera);
          const ph = c.phase;
          if (ph === "open" || ph === "opening") {
            const cores = orbObjects.map((o, i) => orbPhys[i].phase === "alive" ? o.core : null).filter(Boolean);
            renderer.domElement.style.cursor = raycaster.intersectObjects(cores).length > 0 ? "pointer" : "default";
          } else if (ph === "rest") {
            renderer.domElement.style.cursor = raycaster.intersectObject(earthMesh).length > 0 ? "pointer" : "default";
          }
        }

        // ── Orb physics & rendering ──────────────────────────────────────────────
        orbPhys.forEach((op, i) => {
          const oo = orbObjects[i], zone = ZONES[i];
          if (op.phase === "hidden") { oo.group.visible = false; return; }
          oo.group.visible = true;

          if (op.phase === "spawning") {
            if (op.delay > 0) { op.delay--; return; }
            op.spawnT = Math.min(1, op.spawnT + .030);
            op.scale = op.spawnT < .72
              ? lerp(0, 1.28, easeO3(op.spawnT / .72))
              : lerp(1.28, 1.0, easeO3((op.spawnT - .72) / .28));
            op.opacity = Math.min(1, op.spawnT * 2.2);
            op.pos.lerpVectors(
              op.targetPos.clone().normalize().multiplyScalar(2.15),
              op.targetPos,
              easeO5(op.spawnT)
            );
            if (op.spawnT >= 1) {
              op.phase = "alive"; op.scale = 1;
              const spd = .006 + Math.random() * .008, ang = Math.random() * Math.PI * 2;
              op.vel.set(Math.cos(ang) * spd, (Math.random() - .5) * spd * .5, (Math.random() - .4) * spd * .3);
            }
          }

          if (op.phase === "alive") {
            op.pos.add(op.vel);
            const r = op.pos.length();
            if (r < 3.1) op.vel.addScaledVector(op.pos.clone().normalize(), .0022);
            if (r > 6.0) op.vel.addScaledVector(op.pos.clone().normalize(), -.0022);
            if (op.pos.z < 1.4) op.vel.z = Math.abs(op.vel.z) + .001;
            if (op.pos.z > 7.5) op.vel.z = -Math.abs(op.vel.z);
            if (Math.abs(op.pos.y) > 3.8) op.vel.y *= -1;
            if (Math.abs(op.pos.x) > 5.5) op.vel.x *= -1;
            op.vel.multiplyScalar(.999);
            op.vel.x += (Math.random() - .5) * .00018;
            op.vel.y += (Math.random() - .5) * .00010;
            op.vel.z += (Math.random() - .5) * .00010;
            const spd = op.vel.length();
            if (spd > .016) op.vel.multiplyScalar(.016 / spd);
            if (spd < .004) op.vel.multiplyScalar(.004 / spd);
            op.scale = 1; op.opacity = 1;
            // Breathe pulse — slow organic grow/shrink, unique per orb
            op.breatheT += op.breatheSpd;
            op.breathe = 1.0 + 0.12 * Math.sin(op.breatheT);
          }

          if (op.phase === "popping") {
            op.popT = Math.max(0, op.popT - .060);
            op.scale = op.popT > .55
              ? lerp(1, 1.30, (1 - op.popT) / .45)
              : lerp(1.30, 0, easeO3(1 - op.popT / .55));
            op.opacity = Math.min(1, op.popT * 2.0);
            if (op.popT <= 0) { op.phase = "hidden"; oo.group.visible = false; return; }
          }

          // Retract into Earth — smooth pull-back
          if (op.phase === "retracting") {
            op.retractT = Math.min(1, op.retractT + 0.024);
            const e = easeO5(op.retractT);
            op.pos.lerpVectors(op.retractStart, op.retractTarget, e);
            op.opacity = Math.max(0, 1.0 - easeO3(op.retractT * 1.1));
            op.scale = lerp(1.0, 0.05, easeO3(op.retractT));
            op.breathe = 1.0;
            if (op.retractT >= 1) { op.phase = "hidden"; oo.group.visible = false; return; }
          }

          oo.group.position.copy(op.pos);
          // Scale × breathe pulse
          oo.group.scale.setScalar((op.scale < .001 ? .001 : op.scale) * (op.breathe || 1.0));
          oo.core.rotation.x += zone.rot[0];
          oo.core.rotation.y += zone.rot[1];
          oo.core.rotation.z += zone.rot[2];
          if (oo.ring) oo.ring.rotation.z += .011;

          const pulse = .85 + Math.sin(tick * 2.1 + i * 1.3) * .15;
          const glowIntensity = zone.glowK * op.opacity * pulse;
          oo.glowMat.uniforms.coeff.value = glowIntensity * 0.55; // softer orb glow
          oo.innerGlowMat.uniforms.coeff.value = 0;                      // inner bubble off
          oo.ptLight.intensity = op.opacity * (1.2 + Math.sin(tick * 2 + i) * .2);
          oo.coreMat.opacity = op.opacity;
          oo.coreMat.emissiveIntensity = .25 + Math.sin(tick * 1.7 + i * .8) * .10;
          oo.sprite.material.opacity = op.opacity * .88;
        });

        // ── Orb-orb elastic collision ────────────────────────────────────────────
        {
          const COLL_R = 1.1, RESTITUTION = 0.55;
          for (let ci = 0; ci < orbPhys.length; ci++) {
            if (orbPhys[ci].phase !== "alive") continue;
            for (let cj = ci + 1; cj < orbPhys.length; cj++) {
              if (orbPhys[cj].phase !== "alive") continue;
              const diff = orbPhys[ci].pos.clone().sub(orbPhys[cj].pos);
              const dist = diff.length();
              if (dist < COLL_R * 2 && dist > 0.001) {
                const n = diff.divideScalar(dist);
                const overlap = COLL_R * 2 - dist;
                orbPhys[ci].pos.addScaledVector(n, overlap * 0.5);
                orbPhys[cj].pos.addScaledVector(n, -overlap * 0.5);
                const relVel = orbPhys[ci].vel.clone().sub(orbPhys[cj].vel);
                const dot = relVel.dot(n);
                if (dot < 0) {
                  const imp = dot * (1 + RESTITUTION) * 0.5;
                  orbPhys[ci].vel.addScaledVector(n, -imp);
                  orbPhys[cj].vel.addScaledVector(n, imp);
                }
              }
            }
          }
        }

        // ── CO₂ atmosphere colour ────────────────────────────────────────────────
        const tc = co2ThreeColor(currentCarbonFrac);
        atmosMat.uniforms.glowColor.value.lerp(tc, .018);
        rimMat.uniforms.glowColor.value.lerp(tc.clone().multiplyScalar(.52), .018);

        // ── Label 2D projection ──────────────────────────────────────────────────
        const v3 = new THREE.Vector3();
        ZONES.forEach((zone, i) => {
          const op = orbPhys[i], el = labelEls[i];
          if (!el) return;
          const vis = (op.phase === "alive" || op.phase === "spawning") &&
            (cam.phase === "open" || cam.phase === "opening");
          v3.copy(orbObjects[i].group.position);
          const pr = v3.project(camera);
          el.style.left = ((pr.x * .5 + .5) * W) + "px";
          el.style.top = ((-pr.y * .5 + .5) * H) + "px";
          el.style.opacity = vis ? op.opacity.toFixed(3) : "0";
        });

        // ── Castle GLTF: slow spin + opacity sync ───────────────────────────────
        if (castleLoaded && castleModel) {
          const op = orbPhys[COMMUNITY_IDX];
          castleModel.rotation.y += 0.006;
          castleModel.traverse(child => {
            if (child.isMesh && child.material) {
              const mats = Array.isArray(child.material) ? child.material : [child.material];
              mats.forEach(m => { if (m.transparent) m.opacity = op.opacity; });
            }
          });
        }

        // ── Sakura GLTF: gentle spin + opacity sync ───────────────────────────
        if (sakuraLoaded && sakuraModel) {
          const op = orbPhys[DASHBOARD_IDX];
          sakuraModel.rotation.y += 0.005;
          sakuraModel.traverse(child => {
            if (child.isMesh && child.material) {
              const mats = Array.isArray(child.material) ? child.material : [child.material];
              mats.forEach(m => { if (m.transparent) m.opacity = op.opacity; });
            }
          });
        }
        // ── Crab GLTF spin + opacity sync ─────────────────────────────────
        if (crabLoaded && crabModel) {
          const op = orbPhys[CRAB_IDX];
          crabModel.rotation.y += 0.007;
          crabModel.traverse(child => {
            if (child.isMesh && child.material) {
              const mats = Array.isArray(child.material) ? child.material : [child.material];
              mats.forEach(m => { if (m.transparent) m.opacity = op.opacity; });
            }
          });
        }

        // ── Chest GLTF spin + opacity sync ─────────────────────────────────
        if (chestLoaded && chestModel) {
          const op = orbPhys[CHEST_IDX];
          chestModel.rotation.y += 0.005;
          chestModel.traverse(child => {
            if (child.isMesh && child.material) {
              const mats = Array.isArray(child.material) ? child.material : [child.material];
              mats.forEach(m => { if (m.transparent) m.opacity = op.opacity; });
            }
          });
        }

        // ── Ship GLTF spin + opacity sync ─────────────────────────────────
        if (shipLoaded && shipModel) {
          const op = orbPhys[SHIP_IDX];
          shipModel.rotation.y += 0.009;
          shipModel.traverse(child => {
            if (child.isMesh && child.material) {
              const mats = Array.isArray(child.material) ? child.material : [child.material];
              mats.forEach(m => { if (m.transparent) m.opacity = op.opacity; });
            }
          });
        }


        renderer.render(scene, camera);
      }
      animate();

      // ── Resize handler ─────────────────────────────────────────────────────────
      const onResize = () => {
        W = mountEl.clientWidth || window.innerWidth;
        H = mountEl.clientHeight || window.innerHeight;
        renderer.setSize(W, H); camera.aspect = W / H;
        camera.zoom = W < 768 ? W / 768 : 1;
        camera.updateProjectionMatrix();
      };
      window.addEventListener("resize", onResize);
      onResize();

      // ── Public API ─────────────────────────────────────────────────────────────
      // Override atmosphere colour with tier aura (hex string) or null to restore
      let atmosOverride = null;
      return {
        /** Call whenever the CO₂ fraction (0..1) changes */
        updateCarbonFrac(frac) {
          currentCarbonFrac = frac;
        },
        /** Set Earth atmosphere to a tier aura color (hex) or null to restore CO2 color */
        setAtmosOverride(hexColor) {
          atmosOverride = hexColor;
          if (!hexColor) {
            // Immediately snap back to CO2 colour
            const tc = co2ThreeColor(currentCarbonFrac);
            atmosMat.uniforms.glowColor.value.copy(tc);
            rimMat.uniforms.glowColor.value.copy(tc.clone().multiplyScalar(.52));
          } else {
            const col = new THREE.Color(hexColor);
            atmosMat.uniforms.glowColor.value.copy(col);
            rimMat.uniforms.glowColor.value.copy(col.clone().multiplyScalar(.52));
          }
        },
        /** Call after closing a panel to animate back to earth view */
        reset() {
          cam.phase = "resetting";
          cam.progress = 0;
          cam.startPos = camera.position.clone();
          cam.startFov = camera.fov;
          orbPhys.forEach(op => { op.phase = "hidden"; });
        },
        /** Full teardown */
        destroy() {
          cancelAnimationFrame(rafId);
          renderer.domElement.removeEventListener("pointerdown", onDown);
          renderer.domElement.removeEventListener("pointermove", onMove);
          renderer.domElement.removeEventListener("pointerup", onUp);
          window.removeEventListener("resize", onResize);
          if (mountEl.contains(renderer.domElement)) mountEl.removeChild(renderer.domElement);
          if (mountEl.contains(labelDiv)) mountEl.removeChild(labelDiv);
          if (mountEl.contains(hintEl)) mountEl.removeChild(hintEl);
          renderer.dispose();
        },
      };
    }

    // ── FC card (was <FC accent="..."> React component) ───────────────────────────
    // Returns an HTML string for use inside innerHTML templates.
    function fcHTML(inner, { accent = '#22c55e', style = '' } = {}) {

    // ── SVG area chart (replaces Recharts <AreaChart>) ─────────────────────────────
    // data    : array of objects
    // series  : [{ key, color, fill, dashed, width, dots }]
    // opts    : { height, domain, xKey }
    function makeAreaChartSVG(data, series, opts = {}) {
      const VW = 600, VH = opts.height || 200;
      const pad = { t: 8, r: 16, b: 24, l: 32 };
      const iW = VW - pad.l - pad.r;
      const iH = VH - pad.t - pad.b;

      const allVals = data.flatMap(d => series.map(s => d[s.key])).filter(v => v != null && !isNaN(v));
      const maxVal = opts.domain != null ? opts.domain : Math.max(...allVals) * 1.1;

      const xS = i => pad.l + (i / Math.max(data.length - 1, 1)) * iW;
      const yS = v => pad.t + iH - (v / maxVal) * iH;

      // Gradient defs
      const defs = series.map((s, i) => s.fill ? `
    <linearGradient id="ag${i}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="${s.color}" stop-opacity=".40"/>
      <stop offset="100%" stop-color="${s.color}" stop-opacity="0"/>
    </linearGradient>` : ''
      ).join('');

      // Line + area paths — null-safe (null values = no point, line breaks naturally)
      const paths = series.map((s, i) => {
        let line = '', firstJ = null, lastJ = null;
        data.forEach((d, j) => {
          const v = d[s.key];
          if (v == null || isNaN(v)) return;
          if (firstJ === null) firstJ = j;
          lastJ = j;
          line += (line === '' ? 'M' : 'L') + `${xS(j).toFixed(1)},${yS(v).toFixed(1)} `;
        });
        const area = (line && s.fill && firstJ !== null)
          ? `${line} L${xS(lastJ).toFixed(1)},${(pad.t + iH).toFixed(1)} L${xS(firstJ).toFixed(1)},${(pad.t + iH).toFixed(1)} Z`
          : '';
        const dots = (s.dots && !s.dashed)
          ? data.map((d, j) => {
            const v = d[s.key];
            if (v == null || isNaN(v)) return '';
            return `<circle cx="${xS(j).toFixed(1)}" cy="${yS(v).toFixed(1)}" r="3" fill="${s.color}"/>`;
          }).join('')
          : '';
        return `
      ${s.fill && area ? `<path d="${area}" fill="url(#ag${i})"/>` : ''}
      ${line ? `<path d="${line}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}" ${s.dashed ? 'stroke-dasharray="4 4"' : ''}/>` : ''}
      ${dots}`;
      }).join('');

      // X-axis labels — opts.every controls spacing (default 1)
      const every = opts.every || 1;
      const labels = data.map((d, i) => {
        if (i % every !== 0 && i !== data.length - 1) return '';
        return `<text x="${xS(i).toFixed(1)}" y="${(pad.t + iH + 16).toFixed(1)}" fill="rgba(255,255,255,.4)" font-size="11" text-anchor="middle" font-family="Syne,sans-serif">${d[opts.xKey || 'day']}</text>`;
      }).join('');

      return `<svg width="100%" height="${VH}" viewBox="0 0 ${VW} ${VH}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" style="display:block;overflow:visible">
    <defs>${defs}</defs>
    ${paths}
    ${labels}
  </svg>`;
    }

    // ── SVG donut / pie chart (replaces Recharts <PieChart>) ──────────────────────
    // data : [{ name, val, color }]
    function makePieChartSVG(data, { size = 110, inner = 32, outer = 50 } = {}) {
      const cx = size / 2, cy = size / 2;
      const total = data.reduce((s, d) => s + d.val, 0);
      
      if (total === 0) {
        return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
          <circle cx="${cx}" cy="${cy}" r="${(outer + inner) / 2}" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="${outer - inner}" />
        </svg>`;
      }

      const padAngle = 0.05; // gap between slices (radians)
      let angle = -Math.PI / 2;

      const slices = data.map(d => {
        const fullSweep = (d.val / total) * Math.PI * 2;
        const sweep = fullSweep - padAngle;
        const sa = angle + padAngle / 2;
        const ea = sa + sweep;
        angle += fullSweep;
        const x1 = cx + outer * Math.cos(sa), y1 = cy + outer * Math.sin(sa);
        const x2 = cx + outer * Math.cos(ea), y2 = cy + outer * Math.sin(ea);
        const x3 = cx + inner * Math.cos(ea), y3 = cy + inner * Math.sin(ea);
        const x4 = cx + inner * Math.cos(sa), y4 = cy + inner * Math.sin(sa);
        const la = sweep > Math.PI ? 1 : 0;
        return `<path d="M${x1.toFixed(2)},${y1.toFixed(2)} A${outer},${outer} 0 ${la} 1 ${x2.toFixed(2)},${y2.toFixed(2)} L${x3.toFixed(2)},${y3.toFixed(2)} A${inner},${inner} 0 ${la} 0 ${x4.toFixed(2)},${y4.toFixed(2)} Z" fill="${d.color}"/>`;
      }).join('');

      return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${slices}</svg>`;
    }

    // ── Carbon gauge arc (was <CarbonGauge> React component) ──────────────────────
    function makeCarbonGaugeHTML(used, budget) {
      const pct = Math.min(used / budget, 1);
      const rem = Math.max(budget - used, 0);
      const R = 80;
      const circ = 2 * Math.PI * R;
      const arc = circ * .75;
      const off = arc * (1 - pct);
      const col = pct < .6 ? '#22c55e' : pct < .85 ? '#f59e0b' : '#ef4444';

      return `
    <div style="position:relative;width:200px;height:200px;flex-shrink:0">
      <svg width="200" height="200" viewBox="0 0 200 200">
        <defs>
          <linearGradient id="gg" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="#22c55e"/>
            <stop offset="60%"  stop-color="#f59e0b"/>
            <stop offset="100%" stop-color="#ef4444"/>
          </linearGradient>
          <filter id="gf">
            <feGaussianBlur stdDeviation="3" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <circle cx="100" cy="100" r="${R}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="13"
          stroke-dasharray="${arc.toFixed(2)} ${circ.toFixed(2)}"
          stroke-linecap="round" transform="rotate(135 100 100)"/>
        <circle cx="100" cy="100" r="${R}" fill="none" stroke="url(#gg)" stroke-width="13"
          stroke-dasharray="${arc.toFixed(2)} ${circ.toFixed(2)}"
          stroke-dashoffset="${off.toFixed(2)}"
          stroke-linecap="round" transform="rotate(135 100 100)" filter="url(#gf)"
          style="transition:stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1)"/>
      </svg>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
        <div style="font-size:9px;color:rgba(255,255,255,.4);letter-spacing:2px;text-transform:uppercase">REMAINING</div>
        <div style="font-size:30px;font-weight:900;color:${col};font-family:Syne,sans-serif;line-height:1.1">${fmtKg(rem)}</div>
        <div style="font-size:10px;color:rgba(255,255,255,.35);margin-top:3px">of ${fmtKg(budget)} budget</div>
      </div>
    </div>`;
    }

  exitBtn.addEventListener('mouseenter', () => exitBtn.style.background = 'rgba(255,255,255,.2)');
  exitBtn.addEventListener('mouseleave', () => exitBtn.style.background = 'rgba(255,255,255,.1)');

  let years = 1;
  const colorCache = new THREE.Color();

  function updateBiome() {
    const fraction = currentBudget / maxBudget; 
    const severity = Math.max(0, fraction * (years / 10)); 

    smogMat.opacity = Math.min(0.9, Math.max(0, severity - 0.5));
    ambLight.intensity = 0.4 - Math.min(0.3, severity * 0.3);

    const waterColorH = new THREE.Color(0x3b82f6);
    const waterColorT = new THREE.Color(0x4a5a22); 
    const wColor = waterColorH.lerp(waterColorT, Math.min(1, severity));

    const grassColorH = new THREE.Color(0x22c55e);
    const grassColorT = new THREE.Color(0x3a3a3a); 
    const gColor = grassColorH.lerp(grassColorT, Math.min(1, severity));

    const dirtColor = new THREE.Color(0x4a3b2c);

    // Update Vertex Colors
    for(let i=0; i<pos.count; i++) {
       const type = vertexData[i].type;
       if (type === 'water') {
           if (severity > 0.6) colorCache.copy(dirtColor);
           else colorCache.copy(wColor);
       } else if (type === 'grass') {
           colorCache.copy(gColor);
       } else { 
           colorCache.copy(dirtColor);
       }
       colors[i*3] = colorCache.r;
       colors[i*3+1] = colorCache.g;
       colors[i*3+2] = colorCache.b;
    }
    islandGeo.attributes.color.needsUpdate = true;

    // Flora
    const deathThreshold = Math.min(1, Math.max(0, severity * 1.5 - 0.2));
    const bloomFactor = (currentBudget < (maxBudget * 0.5)) ? (years / 10) : 0;

    trees.forEach((t, i) => {
      const isDead = (i / trees.length) < deathThreshold;
      const isSakura = !isDead && (i / trees.length) < bloomFactor;
      t.tg.visible = !isDead && !isSakura;
      sakuraTrees[i].visible = isSakura;
      deadTrees[i].visible = isDead;
    });

    // Fauna & Waterfall
    sheepGroup.visible = severity < 0.6;
    waterfall.visible = severity < 0.6;
    if (severity < 0.6) {
       waterfallMat.color.copy(wColor);
    }

    if (fraction <= 1) {
      if (bloomFactor > 0.5) {
        status.innerHTML = "Exceptional sustainability: the biome flourishes into a vivid Sakura bloom, wildlife thrives.";
        status.style.color = "#ffb7c5";
      } else {
        status.innerHTML = "Sustainable: clean rivers, healthy forests, and active wildlife.";
        status.style.color = "#22c55e";
      }
    } else {
      if (years < 4) {
        status.innerHTML = "Early degradation: rivers recede, vegetation begins to wither.";
        status.style.color = "#f59e0b";
      } else if (years < 8) {
        status.innerHTML = "Severe impact: toxic waterways, dying trees, wildlife fleeing.";
        status.style.color = "#ea580c";
      } else {
        status.innerHTML = "Ecological collapse: thick smog, dried barren ash lands, lifeless void.";
        status.style.color = "#ef4444";
      }
    }
  }

  slider.addEventListener('input', (e) => {
    years = parseInt(e.target.value);
    label.innerText = 'Year ' + years;
    updateBiome();
  });

  exitBtn.addEventListener('click', () => {
    cancelAnimationFrame(animId);
    if(audio) {
      audio.pause();
      audio.currentTime = 0;
    }
    biomeWrap.style.animation = 'fadeOut .5s ease both';
    setTimeout(() => {
      biomeWrap.remove();
      if(onExit) onExit();
    }, 500);
  });

  updateBiome();

  let animId;
  const clock = new THREE.Clock();
  
  function animate() {
    animId = requestAnimationFrame(animate);
    const time = clock.getElapsedTime();
    
    islandGroup.position.y = Math.sin(time * 0.5) * 0.3;
    islandGroup.rotation.y = time * 0.05;
    
    if(sheepGroup.visible) {
      sheepGroup.children.forEach(s => {
        s.userData.timer -= 1;
        if(s.userData.timer <= 0) {
          if(s.userData.walking) {
            s.userData.walking = false;
            s.userData.timer = 60 + Math.random() * 100;
          } else {
            s.userData.walking = true;
            s.userData.targetAngle += (Math.random() - 0.5) * 2;
            s.userData.targetRadius = 1 + Math.random() * 3;
            s.userData.timer = 60 + Math.random() * 100;
          }
        }
        
        if(s.userData.walking) {
          let tx = Math.cos(s.userData.targetAngle) * s.userData.targetRadius;
          let tz = Math.sin(s.userData.targetAngle) * s.userData.targetRadius;
          let dx = tx - s.position.x;
          let dz = tz - s.position.z;
          let dist = Math.sqrt(dx*dx + dz*dz);
          if(dist > 0.01) {
            s.position.x += (dx/dist) * s.userData.speed;
            s.position.z += (dz/dist) * s.userData.speed;
            s.rotation.y = Math.atan2(-dz, dx);
          }
        }
        // Bobbing animation for sheep
        s.children[0].position.y = 0.15 + (s.userData.walking ? Math.abs(Math.sin(time*15))*0.03 : 0);
        s.children[1].position.y = 0.22 + (s.userData.walking ? Math.abs(Math.sin(time*15))*0.02 : 0);
      });
    }

    if (waterfall.visible) {
      const positions = waterfall.geometry.attributes.position.array;
      for(let i=0; i<particleCount; i++) {
        wVelocities[i] -= 0.01; 
        positions[i*3+1] += wVelocities[i];
        if (positions[i*3+1] < -3) {
          positions[i*3+1] = 1.0; 
          wVelocities[i] = -(0.02 + Math.random()*0.02);
        }
      }
      waterfall.geometry.attributes.position.needsUpdate = true;
    }

    smogMesh.rotation.y = time * 0.1;
    smogMesh.rotation.z = time * 0.05;

    renderer.render(scene, camera);
  }
  animate();

  const onResize = () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  };
  window.addEventListener('resize', onResize);
}

    // ═══ planner.js ═══

    //  BUDGET PLANNER PANEL
    //  Sliders update the total display in real-time via targeted DOM updates.
    // ═══════════════════════════════════════════════════════════════════════════════
    function createPlannerPanel(container, { onBack } = {}) {

      // ── State & Persistence ──────────────────────────────────────────────────
      const authUser = onBack._authUser || null;
      const ud = (typeof loadUserData === 'function' && authUser) ? loadUserData(authUser) : {};
      const bud = ud.plannerConfig || { transport: 10, food: 400, energy: 5, digital: 4, waste: 1 };

      const cols = { transport: "#3b82f6", food: "#22c55e", energy: "#f59e0b", digital: "#a855f7", waste: "#ef4444" };
      const ics = { transport: "🚗", food: "🥗", energy: "⚡", digital: "📱", waste: "♻️" };

      const scales = {
        transport: { label: "km", max: 50, factor: 0.15, step: 1 },
        food: { label: "g", max: 1000, factor: 0.00375, step: 25 },
        energy: { label: "kWh", max: 20, factor: 0.78, step: 0.5 },
        digital: { label: "hours", max: 16, factor: 0.03, step: 0.5 },
        waste: { label: "kg", max: 5, factor: 0.5, step: 0.1 }
      };

      const tot = () => {
        let t = 0;
        for (const cat in bud) {
          t += bud[cat] * scales[cat].factor;
        }
        return t;
      };

      const saveBud = () => {
        if (authUser && typeof saveUserData === 'function') {
          ud.plannerConfig = bud;
          saveUserData(authUser, ud);
        }
      };

      // ── Category slider rows ───────────────────────────────────────────────────
      const catRows = Object.entries(bud).map(([cat, val]) => {
        const sc = scales[cat];
        return `
    <div style="background:rgba(2,6,16,.84);border:1px solid ${cols[cat]}22;border-radius:14px;padding:16px 18px;margin-bottom:12px;backdrop-filter:blur(22px)">
      <div style="display:flex;justify-content:space-between;margin-bottom:9px">
        <div style="display:flex;align-items:center;gap:9px">
          <span style="font-size:18px">${ics[cat]}</span>
          <span style="font-size:13px;font-weight:700;color:rgba(255,255,255,.8);text-transform:capitalize">${cat}</span>
        </div>
        <div style="text-align:right">
          <div class="cat-val" data-cat="${cat}" style="font-size:15px;font-weight:700;color:${cols[cat]}">${val.toFixed(1)} ${sc.label}</div>
          <div class="cat-co2" data-cat="${cat}" style="font-size:10px;color:rgba(255,255,255,.4)">~${(val * sc.factor).toFixed(2)} kg CO₂e</div>
        </div>
      </div>
      <input type="range" class="cat-slider" data-cat="${cat}" min="0" max="${sc.max}" step="${sc.step}" value="${val}"
        style="width:100%;accent-color:${cols[cat]};cursor:pointer;color:${cols[cat]};background:linear-gradient(90deg,${cols[cat]} 0%,${cols[cat]} ${(val / sc.max * 100).toFixed(0)}%,rgba(255,255,255,.12) ${(val / sc.max * 100).toFixed(0)}%)"/>
      <div style="display:flex;justify-content:space-between;font-size:9px;color:rgba(255,255,255,.3);margin-top:3px">
        <span>0 ${sc.label}</span><span>${sc.max} ${sc.label}</span>
      </div>
    </div>`;
      }).join('');

      // ── Initial render ─────────────────────────────────────────────────────────
      const t0 = tot();
      const bal0 = t0 <= DAILY_BUDGET;
      container.innerHTML = `
    <div style="${PS.wrap}">
      <button class="back-btn" style="${PS.bb}">← Return to Earth</button>
      <h1 style="${PS.h1};background:linear-gradient(135deg,#ffb0c0,#ff6688);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Budget Planner</h1>
      <span style="${PS.sub}">Allocate your daily ${DAILY_BUDGET} kg CO₂e budget using practical units</span>

      <div style="margin-top:16px;text-align:center;margin-bottom:16px;">
        <button id="save-limit-btn" style="padding:12px 24px;border-radius:20px;border:none;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:Syne,sans-serif;box-shadow:0 0 15px rgba(34,197,94,0.4);transition:transform 0.2s;margin-right:10px;">Confirm Limit</button>
        <button id="enter-biome-btn" style="padding:12px 24px;border-radius:20px;border:none;background:linear-gradient(135deg,#aa88ff,#8855ff);color:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:Syne,sans-serif;box-shadow:0 0 15px rgba(170,136,255,0.4);transition:transform 0.2s;">Enter Carbon Futures Biome</button>
      </div>

      <!-- Total summary card -->
      <div style="background:rgba(2,6,16,.84);border:1px solid #ff668822;border-radius:14px;padding:16px 18px;margin-bottom:18px;text-align:center;backdrop-filter:blur(22px)">
        <div style="font-size:10px;color:rgba(255,255,255,.4);letter-spacing:2px;text-transform:uppercase">Total Planned Emissions</div>
        <div id="total-val" style="font-size:44px;font-weight:900;color:${bal0 ? '#22c55e' : '#ef4444'};font-family:Syne,sans-serif">
          ${t0.toFixed(1)}<span style="font-size:18px"> kg CO₂e</span>
        </div>
        <div id="total-label" style="font-size:12px;color:rgba(255,255,255,.4)">
          vs Global Safe Budget: ${DAILY_BUDGET} kg · ${bal0 ? '✅ Balanced' : '⚠️ Over budget'}
        </div>
        <div style="margin-top:14px;height:7px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden">
          <div id="total-bar" style="height:100%;border-radius:3px;transition:width .5s ease;
            width:${Math.min((t0 / DAILY_BUDGET) * 100, 100).toFixed(1)}%;
            background:${bal0 ? 'linear-gradient(90deg,#22c55e,#86efac)' : 'linear-gradient(90deg,#f59e0b,#ef4444)'}">
          </div>
        </div>
      </div>

      <!-- Category sliders -->
      ${catRows}
    </div>`;

      container.querySelector('.back-btn').addEventListener('click', onBack);

      
      const saveBtn = container.querySelector('#save-limit-btn');
      if (saveBtn) {
        saveBtn.addEventListener('click', (e) => {
          saveBud();
          const old = e.target.innerText;
          e.target.innerText = 'Saved!';
          setTimeout(() => e.target.innerText = old, 2000);
        });
      }
      const biomeBtn = container.querySelector('#enter-biome-btn');
      biomeBtn.addEventListener('mouseenter', () => biomeBtn.style.transform = 'scale(1.05)');
      biomeBtn.addEventListener('mouseleave', () => biomeBtn.style.transform = 'scale(1)');
      biomeBtn.addEventListener('click', () => {
        const wrap = container.querySelector('div');
        wrap.style.display = 'none'; // Hide planner UI
        
        createBiomeScene(container, tot(), DAILY_BUDGET, () => {
          wrap.style.display = 'block'; // Show planner UI back
        });
      });

      // ── Slider event handlers ──────────────────────────────────────────────────
      container.querySelectorAll('.cat-slider').forEach(slider => {
        slider.addEventListener('input', () => {
          const cat = slider.dataset.cat;
          bud[cat] = parseFloat(slider.value);
          const sc = scales[cat];

          // Update that category's value display
          container.querySelector(`.cat-val[data-cat="${cat}"]`).textContent = bud[cat].toFixed(1) + ' ' + sc.label;
          container.querySelector(`.cat-co2[data-cat="${cat}"]`).textContent = '~' + (bud[cat] * sc.factor).toFixed(2) + ' kg CO₂e';
          
          // Update slider fill to show progress
          const pct = (bud[cat] / sc.max * 100).toFixed(0);
          slider.style.background = `linear-gradient(90deg,${cols[cat]} 0%,${cols[cat]} ${pct}%,rgba(255,255,255,.12) ${pct}%)`;

          // Save state
          saveBud();

          // Recompute total and update summary card
          const t = tot();
          const bal = t <= DAILY_BUDGET;

          const totalValEl = container.querySelector('#total-val');
          const totalLblEl = container.querySelector('#total-label');
          const totalBarEl = container.querySelector('#total-bar');

          totalValEl.innerHTML = `${t.toFixed(1)}<span style="font-size:18px"> kg CO₂e</span>`;
          totalValEl.style.color = bal ? '#22c55e' : '#ef4444';
          totalLblEl.textContent = `vs Global Safe Budget: ${DAILY_BUDGET} kg · ${bal ? '✅ Balanced' : '⚠️ Over budget'}`;
          totalBarEl.style.width = Math.min((t / DAILY_BUDGET) * 100, 100).toFixed(1) + '%';
          totalBarEl.style.background = bal
            ? 'linear-gradient(90deg,#22c55e,#86efac)'
            : 'linear-gradient(90deg,#f59e0b,#ef4444)';
        });
      });
    }

    function createCommunityPanel(container, { onBack } = {}) {

      // Helper to escape HTML (prevents XSS)
      function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function (m) {
          if (m === '&') return '&amp;';
          if (m === '<') return '&lt;';
          if (m === '>') return '&gt;';
          return m;
        });
      }

      // ── Render leaderboard from Supabase ──────────────────────────────
      async function renderLeaderboard() {
        const { data, error } = await supabaseClient
          .from('profiles')
          .select('username, city, avg_daily_emission, auth0_id')
          .order('avg_daily_emission', { ascending: true })

          return `<div style="background:rgba(2,6,16,.84);border-radius:14px;padding:20px;text-align:center">Unable to load leaderboard.</div>`;

      // ── Challenges (driven by ACHIEVEMENTS registry) ───────────────────
      function challengesHTML() {
        const earned = checkAndAwardAchievements(authUser);
        return ACHIEVEMENTS.map(a => {
          const done = earned.includes(a.id);
          // Compute a progress percentage via check on partial data where possible
          let pct = done ? 100 : 0;
          // For count-based ones, try to get partial progress
          if (!done) {
            const logs = ud.activitiesLogged || 0;
            const kgS  = ud.kgSaved || 0;
            const pts  = ud.pts || 0;
            const totalDays = Object.keys(ud.dailyHistory || {}).length;
            const targets = { rhythm:5, enthusiast:20, devotee:50, century_logs:100,
              first_drop:1, keeper:10, ton_saver:1000,
              consistent:10, month_streak:30,
              guardian:20, ecologist:60, sovereign:100 };
            const logsBased   = ['rhythm','enthusiast','devotee','century_logs'];
            const kgBased     = ['first_drop','keeper','ton_saver'];
            const dayBased    = ['consistent','month_streak'];
            const ptsBased    = ['guardian','ecologist','sovereign'];
            if (logsBased.includes(a.id)) pct = Math.min(99, Math.round(logs / targets[a.id] * 100));
            else if (kgBased.includes(a.id)) pct = Math.min(99, Math.round(kgS / targets[a.id] * 100));
            else if (dayBased.includes(a.id)) pct = Math.min(99, Math.round(totalDays / targets[a.id] * 100));
            else if (ptsBased.includes(a.id)) pct = Math.min(99, Math.round(pts / targets[a.id] * 100));
