              <div style="font-size:13px;font-weight:700;color:${done?'#fff':'rgba(255,255,255,.75)'}">${a.title}</div>
              <div style="font-size:11px;color:rgba(255,255,255,.4);margin-top:2px">${a.desc}</div>
            </div>
          </div>
          <div style="font-size:11px;color:#aa88ff;background:rgba(170,136,255,.1);padding:4px 10px;border-radius:12px;align-self:flex-start;white-space:nowrap;margin-left:8px">${rewardLabel}</div>
        </div>
        <div style="height:5px;background:rgba(255,255,255,.07);border-radius:3px">
          <div style="height:100%;width:${pct}%;background:${done?'#aa88ff':'linear-gradient(90deg,#3b82f6,#aa88ff)'};border-radius:3px;transition:width .6s ease"></div>
        </div>
        <div style="font-size:10px;color:${done?'#aa88ff':'rgba(255,255,255,.3)'};margin-top:5px">${pct}%${done?' ✅ Complete':''}</div>
      </div>`;
        }).join('');
      }

      // ── Achievements (driven by ACHIEVEMENTS registry) ────────────────
      function achievementsHTML() {
        const earned = checkAndAwardAchievements(authUser);
        return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">' +
          ACHIEVEMENTS.map(a => {
            const e = earned.includes(a.id);
            return `
        <div style="background:rgba(2,6,16,.84);border:1px solid ${e?'#aa88ff44':'rgba(255,255,255,.07)'};border-radius:14px;padding:14px;text-align:center;opacity:${e?1:.38};filter:${e?'none':'grayscale(.9)'};backdrop-filter:blur(22px);transition:opacity .3s,filter .3s">
          <div style="font-size:26px;margin-bottom:5px">${a.icon}</div>
          <div style="font-size:11px;font-weight:700;color:rgba(255,255,255,.88)">${a.title}</div>
          <div style="font-size:10px;color:rgba(255,255,255,.38);margin-top:3px;line-height:1.4">${a.desc}</div>

    // ---------- UPDATE LEADERBOARD IN SUPABASE ----------
    async function updateUserLeaderboard(authUser, weeklyLog, todayEntries) {
      // ========== CONSOLE LOG 1: FUNCTION STARTED ==========
      console.log('🔵 updateUserLeaderboard CALLED for user:', authUser?.sub);

      if (!authUser || !authUser.sub) return;

      // Calculate average daily emission (last 7 days or today)
      let total = 0, count = 0;
      if (weeklyLog && weeklyLog.length) {
        total = weeklyLog.reduce((a, b) => a + (b || 0), 0);
        count = weeklyLog.filter(v => v > 0).length;
      }
      if (count === 0 && todayEntries && todayEntries.length) {
        total = todayEntries.reduce((s, e) => s + e.kg, 0);
        count = 1;
      }
      const avg = count > 0 ? total / count : 0;

      // ========== CONSOLE LOG 2: CALCULATED VALUES ==========
      console.log('📊 Calculated values - Avg:', avg.toFixed(2), 'kg/day | Count:', count);

      // Get city from stored geo data (or empty)
      const geo = window._ecoGeoData || {};
      const city = geo.city || '';

      // Get username from user data
      const ud = loadUserData(authUser);
      const username = ud.username || authUser.name || authUser.email?.split('@')[0] || 'Explorer';

      // ========== CONSOLE LOG 3: ABOUT TO UPSERT ==========
      console.log('📤 Upserting to Supabase - Username:', username, '| City:', city, '| Avg:', avg.toFixed(2));

      // Upsert into Supabase
      const { error } = await supabaseClient
        .from('profiles')
        .upsert({
          auth0_id: authUser.sub,
          username: username,
          city: city,
          avg_daily_emission: parseFloat(avg.toFixed(2)),
          pts: ud.pts || 0,
          achievements: ud.achievements || [],
          bio: ud.bio || '',
          instagram: ud.instagram || '',
          twitter: ud.twitter || '',
          linkedin: ud.linkedin || '',
          avatar_url: authUser.picture || '',
          activities_logged: ud.activitiesLogged || 0,
          kg_saved: ud.kgSaved || 0,
          updated_at: new Date().toISOString()
        }, { onConflict: 'auth0_id' });

      // ========== CONSOLE LOG 4: RESULT ==========
      if (error) {
        console.error('❌ Supabase ERROR:', error);
      } else {
        console.log('✅ Supabase SUCCESS! Row upserted for', username);
      }
    }
    function awardPoints(authUser, pts, reason) {
      const data = loadUserData(authUser);
      data.pts += pts;
      saveUserData(authUser, data);
      return data;
    }

    function buildTrophyShelf(earnedIds, limit) {
      const earned = ACHIEVEMENTS.filter(a => earnedIds.includes(a.id));
      if (!earned.length) return '';
      const show = limit ? earned.slice(0, limit) : earned;
      const extra = limit && earned.length > limit ? earned.length - limit : 0;
      return '<div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px;margin-bottom:4px;">' +
        show.map(a =>
          '<div title="' + a.title + '" style="width:32px;height:32px;border-radius:50%;background:rgba(170,136,255,.15);' +
          'border:1px solid rgba(170,136,255,.3);display:flex;align-items:center;justify-content:center;' +
          'font-size:16px;cursor:default;transition:transform .2s;" ' +
          'onmouseenter="this.style.transform=\\\'scale(1.3)\\\'" onmouseleave="this.style.transform=\\\'scale(1)\\\'">' +
          a.icon + '</div>'
        ).join('') +
        (extra ? '<div style="width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.08);' +
          'display:flex;align-items:center;justify-content:center;font-size:10px;color:rgba(255,255,255,.4);">+' + extra + '</div>' : '') +

        // ── Helpers ────────────────────────────────────────────────────────────
        function hexToRgb(hex) {
          return [parseInt(hex.slice(1,3),16)/255, parseInt(hex.slice(3,5),16)/255, parseInt(hex.slice(5,7),16)/255];
        }

        // ─── buildMolGroup: CPK colours with strong emissive glow ────────────
        function buildMolGroup(mol) {
          const g = new THREE.Group();
          mol.atoms.forEach(a => {
            const [r,gv,b] = hexToRgb(a.c);
            const geo = new THREE.SphereGeometry(a.r * SCALE * 0.85, 16, 16);
            // MeshStandardMaterial gives physically correct color even in dark scenes
            const mat = new THREE.MeshStandardMaterial({
              color:            new THREE.Color(r, gv, b),
              emissive:         new THREE.Color(r, gv, b),   // full color self-glow
              emissiveIntensity: 0.8,
              roughness:        0.25,
              metalness:        0.15,
              transparent:      true,
              opacity:          0.88
            });
            const m = new THREE.Mesh(geo, mat);
            m.position.set(a.x * SCALE, a.y * SCALE, a.z * SCALE);
            g.add(m);
          });
          mol.bonds.forEach(([i,j]) => {
            const aA = mol.atoms[i], aB = mol.atoms[j];
            const s = new THREE.Vector3(aA.x*SCALE, aA.y*SCALE, aA.z*SCALE);
            const e = new THREE.Vector3(aB.x*SCALE, aB.y*SCALE, aB.z*SCALE);
            const dir = new THREE.Vector3().subVectors(e, s);
            const len = dir.length();
            const geo = new THREE.CylinderGeometry(BOND_R, BOND_R, len, 10);
            const [r1,g1,b1] = hexToRgb(aA.c);
            const [r2,g2,b2] = hexToRgb(aB.c);
            const mat = new THREE.MeshStandardMaterial({
              color:            new THREE.Color((r1+r2)/2, (g1+g2)/2, (b1+b2)/2),
              emissive:         new THREE.Color((r1+r2)/2, (g1+g2)/2, (b1+b2)/2),
              emissiveIntensity: 0.6,
              roughness:        0.3,
              metalness:        0.1,
              transparent:      true,
              opacity:          0.80
            });
            const cyl = new THREE.Mesh(geo, mat);
            cyl.position.copy(new THREE.Vector3().addVectors(s,e).multiplyScalar(0.5));
            if (dir.length() > 0.0001) {
              cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
            }
            g.add(cyl);
          });
          return g;
        }

        // ── Canvas: panels-only, hidden on main earth page ────────────────────
        const W = window.innerWidth, H = window.innerHeight;
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.setSize(W, H);
        renderer.setClearColor(0x000000, 0);
        renderer.physicallyCorrectLights = true;
        renderer.domElement.style.cssText =
          'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8000;' +
          'display:none;opacity:0;transition:opacity 0.7s ease;' +
          'filter:blur(0.4px);';          // very slight blur for integration
        renderer.domElement.id = 'mol-bg-canvas';
        document.body.appendChild(renderer.domElement);

        // ── Scene ─────────────────────────────────────────────────────────────
        const scene  = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, W/H, 0.01, 500);
        camera.position.z = 20;

        // Dark ambient so emissive glow is the main visual → vivid colors
        scene.add(new THREE.AmbientLight(0xffffff, 0.25));
        const dlTop = new THREE.DirectionalLight(0xffffff, 0.8);
        dlTop.position.set(5, 10, 8); scene.add(dlTop);
        const dlFill = new THREE.DirectionalLight(0xc8e8ff, 0.4);
        dlFill.position.set(-8, -4, -6); scene.add(dlFill);

        // ── Build all 33 molecules ─────────────────────────────────────────────
        let molBgVisible = false;
        const instances = MOLECULES.map(mol => {
          const g = buildMolGroup(mol);
          g.userData = { mol };
          g.visible = false;   // start invisible; scatter() will position & show
          scene.add(g);
          return g;
        });

        // ── scatter(): randomise positions & motion each time panel opens ─────
        function scatter() {
          // Pick a random count (18–26) of molecules to show
          const count = 18 + Math.floor(Math.random() * 9);
          // Shuffle indices
          const idx = MOLECULES.map((_,i)=>i).sort(()=>Math.random()-0.5);

          instances.forEach((g, i) => {
            if (i >= count) { g.visible = false; return; }
            g.visible = true;

            // Fresh random position covering full viewport area
            const rx = (Math.random() - 0.5) * 36; // x: ±18
            const ry = (Math.random() - 0.5) * 22; // y: ±11
            const rz = (Math.random() - 0.5) * 8;  // z depth variation
            g.position.set(rx, ry, rz);
            g.rotation.set(
              Math.random()*Math.PI*2,
              Math.random()*Math.PI*2,
              Math.random()*Math.PI*2
            );

            // Fresh random motion parameters
            g.userData.rx  = (Math.random()-.5) * 0.010;
            g.userData.ry  = 0.005 + Math.random() * 0.008;
            g.userData.rz  = (Math.random()-.5) * 0.007;
            // Drift velocity (wanders across screen slowly)
            g.userData.vx  = (Math.random()-.5) * 0.012;
            g.userData.vy  = (Math.random()-.5) * 0.010;
            // Float oscillation
            g.userData.fp  = Math.random() * Math.PI * 2;
            g.userData.fs  = 0.004 + Math.random() * 0.004;
            g.userData.fa  = 0.06  + Math.random() * 0.08;
            // Wander direction change timer
            g.userData.wt  = 0;
            g.userData.wd  = 60 + Math.floor(Math.random() * 120); // frames between direction change
          });
        }

        // ── Show/Hide API called by openPanel / closePanel / profile ──────────
        window.showMolBg = function(panelId) {
          molBgVisible = true;
          scatter();                         // new random positions every time
          const c = renderer.domElement;
          c.style.display = 'block';
          requestAnimationFrame(() => { c.style.opacity = '0.90'; });

          // Cursor glow: colour based on panel
          const PANEL_GLOW = {
            dashboard:  '#00ff88',
            log:        '#00cfff',
            insights:   '#ffaa00',
            planner:    '#ff6688',
            community:  '#aa88ff',
            profile:    '#22c55e'
          };
          const glowColor = PANEL_GLOW[panelId] || '#22c55e';
          // Update ripple wave color for this panel
          window._panelRippleColor = glowColor;
        };
        window.hideMolBg = function() {
          molBgVisible = false;
          const c = renderer.domElement;
          c.style.opacity = '0';
          setTimeout(() => { c.style.display = 'none'; }, 700);
        };

        // ── Ripple system: injected directly into panel boxes via class ────────
        // No global overlay div needed — ripples live inside each card and are
        // clipped by overflow:hidden on the card, so they can NEVER leak outside.
        window._panelRippleColor = '#22c55e'; // updated by showMolBg(panelId)

        // Inject ripple CSS once
        if (!document.getElementById('ripple-style')) {
          const rs = document.createElement('style');
          rs.id = 'ripple-style';
          rs.textContent = `
            .ripple-host { position:relative; overflow:hidden; }
            .ripple-wave {
              position:absolute;
              border-radius:50%;
              transform:scale(0);
              pointer-events:none;
              animation:ripple-expand 0.65s cubic-bezier(.2,.6,.3,1) forwards;
            }
            @keyframes ripple-expand {
              0%   { transform:scale(0); opacity:0.55; }
              70%  { transform:scale(1); opacity:0.18; }
              100% { transform:scale(1.3); opacity:0; }
            }
          `;
          document.head.appendChild(rs);
        }

        // Spawn a single ripple wave at cursor position inside a .ripple-host element
        function spawnRipple(host, cx, cy) {
          const rect = host.getBoundingClientRect();
          const x = cx - rect.left;
          const y = cy - rect.top;
          const size = Math.max(rect.width, rect.height) * 1.6;
          const rw = document.createElement('div');
          rw.className = 'ripple-wave';
          rw.style.cssText = `
            width:${size}px;height:${size}px;
            left:${x - size/2}px;top:${y - size/2}px;
            background:radial-gradient(circle,${window._panelRippleColor}44 0%,transparent 65%);
          `;
          host.appendChild(rw);
          rw.addEventListener('animationend', () => rw.remove());
        }

        // Attach ripple listeners to all .ripple-host elements inside panelOverlay
        // Called each time a panel opens (new DOM is injected)
        window._attachRipples = function(container) {
          container.querySelectorAll('.ripple-host').forEach(host => {
            // Throttled mousemove: one ripple per 200ms per host
            let last = 0;
            host.addEventListener('mousemove', e => {
              const now = Date.now();
              if (now - last < 200) return;
              last = now;
              spawnRipple(host, e.clientX, e.clientY);
            });
          });
        };

        // ── Tooltip ────────────────────────────────────────────────────────────
        const tip = document.createElement('div');
        tip.style.cssText =
          'position:fixed;background:rgba(1,3,12,.90);border:1px solid rgba(34,197,94,.4);' +
          'border-radius:12px;padding:7px 14px;font-family:Syne,sans-serif;pointer-events:none;' +
          'z-index:9999;opacity:0;transition:opacity .35s ease;backdrop-filter:blur(14px);' +
          'box-shadow:0 0 22px rgba(34,197,94,.18);';
        tip.innerHTML =
          '<div style="font-size:12px;font-weight:700;color:#86efac;margin-bottom:2px;"></div>' +
          '<div style="font-size:10px;color:rgba(255,255,255,.55);letter-spacing:.3px;"></div>';
        document.body.appendChild(tip);

        // ── Raycaster ─────────────────────────────────────────────────────────
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2(-9999,-9999);
        let hoveredGroup = null, tipFadeTO = null;
        let mxN = 0, myN = 0;

        function onMove(cx, cy) {
          // (Ripple is handled via mousemove listeners attached to .ripple-host elements)

          const rx = cx / window.innerWidth;
          const ry = cy / window.innerHeight;
          mxN = (rx - 0.5) * 0.4;
          myN = (ry - 0.5) * 0.25;

          // Only raycast when panel is actually open — fixes main screen tooltip bug
          if (!molBgVisible) {
            if (hoveredGroup) { hoveredGroup = null; tip.style.opacity = '0'; }
            return;
          }

          mouse.x =  rx * 2 - 1;
          mouse.y = -ry * 2 + 1;
          raycaster.setFromCamera(mouse, camera);

          let hit = null;
          for (const g of instances) {
            if (!g.visible) continue;
            const meshes = g.children.filter(c => c.isMesh && c.geometry.type === 'SphereGeometry');
            if (raycaster.intersectObjects(meshes).length) { hit = g; break; }
          }

          if (hit && hit !== hoveredGroup) {
            hoveredGroup = hit;
            clearTimeout(tipFadeTO);
            tip.children[0].textContent = hit.userData.mol.name;
            tip.children[1].textContent = hit.userData.mol.formula + ' · ' + hit.userData.mol.shape;
            tip.style.opacity = '1';
            tip.style.left = (cx + 16) + 'px';
            tip.style.top  = (cy - 12) + 'px';
          } else if (!hit && hoveredGroup) {
            hoveredGroup = null;
            clearTimeout(tipFadeTO);
            tipFadeTO = setTimeout(() => { tip.style.opacity = '0'; }, 700);
          } else if (hit) {
            tip.style.left = (cx + 16) + 'px';
            tip.style.top  = (cy - 12) + 'px';
          }
        }

        document.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
        document.addEventListener('touchmove', e => {
          if (e.touches[0]) onMove(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });

        // ── Animation loop ─────────────────────────────────────────────────────
        let t = 0;
        const BOUND = { x: 20, y: 13 };   // wrap-around boundary

        function animate() {
          requestAnimationFrame(animate);
          t++;

          if (!molBgVisible) { renderer.render(scene, camera); return; }

          // Subtle camera parallax
          camera.position.x += (mxN * 2.0 - camera.position.x) * 0.03;
          camera.position.y += (-myN * 1.5 - camera.position.y) * 0.03;
          camera.lookAt(0, 0, 0);

          instances.forEach(g => {
            if (!g.visible) return;
            const d = g.userData;

            // Rotation
            g.rotation.x += d.rx;
            g.rotation.y += d.ry;
            g.rotation.z += d.rz;

            // Wander: occasionally nudge drift direction
            d.wt++;
            if (d.wt > d.wd) {
              d.wt = 0;
              d.wd = 60 + Math.floor(Math.random() * 120);
              d.vx += (Math.random() - 0.5) * 0.010;
              d.vy += (Math.random() - 0.5) * 0.008;
              // Clamp drift speed
              const spd = Math.sqrt(d.vx*d.vx + d.vy*d.vy);
              if (spd > 0.018) { d.vx *= 0.018/spd; d.vy *= 0.018/spd; }
            }

            // Apply drift + float oscillation
            g.position.x += d.vx;
            g.position.y += d.vy + Math.sin(t * d.fs + d.fp) * d.fa * 0.022;
            g.position.z += Math.cos(t * d.fs * 0.5 + d.fp) * 0.003;

            // Soft wrap-around: fade out and teleport to opposite edge
            if (Math.abs(g.position.x) > BOUND.x) g.position.x *= -0.85;
            if (Math.abs(g.position.y) > BOUND.y) g.position.y *= -0.85;
          });

          renderer.render(scene, camera);
        }
        animate();

        window._molBgRenderer = renderer;
        window._molBgTip      = tip;
      })();



      // ── AtmosLegend ────────────────────────────────────────────────────────────
      const atmosDiv = document.createElement('div');
      atmosDiv.id = 'atmos-legend';
      app.appendChild(atmosDiv);

      function updateAtmosLegend() {
        const f = frac();
        const col = co2HexColor(f);
        const lbl = f < .3 ? "Safe ✓" : f < .55 ? "Moderate" : f < .8 ? "High" : "Critical ⚠";
        const pos = Math.min(f * 100 * .58, 52).toFixed(1);
        atmosDiv.style.cssText = `position:fixed;bottom:28px;left:28px;z-index:50;display:flex;align-items:center;gap:10px;background:rgba(1,3,12,.80);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:8px 16px;backdrop-filter:blur(14px);font-family:Syne,sans-serif;box-shadow:0 0 22px ${col}30;`;
        atmosDiv.innerHTML = `
      <div style="width:9px;height:9px;border-radius:50%;background:${col};box-shadow:0 0 8px ${col};flex-shrink:0"></div>
      <div>
        <div style="font-size:9px;color:rgba(255,255,255,.38);letter-spacing:1.5px;text-transform:uppercase">CO₂ Atmosphere</div>
        <div style="font-size:12px;font-weight:700;color:${col}">${lbl} · ${(f * 100).toFixed(0)}% budget</div>
      </div>
      <div style="width:64px;height:4px;border-radius:2px;background:linear-gradient(90deg,#ffffff,#ffaa00,#ff1a1a);opacity:.65;position:relative">
        <div style="position:absolute;top:-3px;left:${pos}%;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.4);transition:left .5s ease"></div>
      </div>`;
      }

      // ── Panel open / close ─────────────────────────────────────────────────────
      function openPanel(id) {
        if (!PANELS[id]) return;
        panelOpen = true;
        sliderWrap.style.display = 'none';
        atmosDiv.style.display = 'none';

        // Clear previous panel content (keep the ambient glow div)
        while (panelOverlay.children.length > 1) panelOverlay.removeChild(panelOverlay.lastChild);

        const panelContent = document.createElement('div');
        panelOverlay.appendChild(panelContent);
        const onBackWithAuth = closePanel;
        onBackWithAuth._authUser = authUser;
        PANELS[id](panelContent, { onBack: onBackWithAuth });

        // Tag all card-like divs as ripple hosts and attach listeners
        // (cards have backdrop-filter and a visible background)
        requestAnimationFrame(() => {
          panelContent.querySelectorAll('div').forEach(el => {
            const cs = window.getComputedStyle(el);
            const bf = cs.backdropFilter || cs.webkitBackdropFilter || '';
            const bg = cs.backgroundColor || '';
            const br = cs.borderRadius || '';
            // Card signature: has backdrop-filter blur AND a semi-transparent bg AND border-radius
            if (bf.includes('blur') && bg !== 'rgba(0, 0, 0, 0)' &&
                bg !== 'transparent' && parseFloat(br) >= 8) {
              if (!el.classList.contains('ripple-host')) {
                el.classList.add('ripple-host');
              }
            }
          });
          if (window._attachRipples) window._attachRipples(panelContent);
        });

        panelOverlay.style.display = 'block';
        // Force a reflow so the transition fires
        panelOverlay.getBoundingClientRect();
        panelOverlay.style.opacity = '1';
        panelOverlay.style.transform = 'scale(1) translateY(0)';

        // Show molecular background with panel colour accent
        if (window.showMolBg) window.showMolBg(id);
      }

      function closePanel() {
        if (window.hideMolBg) window.hideMolBg();
        panelOverlay.style.opacity = '0';
        panelOverlay.style.transform = 'scale(.97) translateY(-16px)';
        setTimeout(() => {
          panelOverlay.style.display = 'none';
          panelOpen = false;
          sliderWrap.style.display = 'block';
          // Restore the full atmosphere legend (cssText including display:flex)
          // instead of just setting display:'', which would lose the flex layout
          updateAtmosLegend();
          if (earthScene) earthScene.reset();
        }, 440);
      }

      // ── Initialise Earth scene ─────────────────────────────────────────────────
      earthScene = createEarthScene(earthWrap, { onPanelOpen: openPanel });
      // Sync real CO2 from user data immediately on load
      co2 = getTodayKg();
      document.getElementById('header-co2').textContent = co2.toFixed(1) + ' / ' + DAILY_BUDGET + ' kg CO₂e today';
      earthScene.updateCarbonFrac(frac());

      // ── Intro animation (was useEffect 320ms delay in React) ──────────────────
      setTimeout(() => {
        // Signal real readiness to the loader before removing it
      if (window._resolveGaiaLoader) window._resolveGaiaLoader();
      setTimeout(() => { if (window.removeGlobalLoader) window.removeGlobalLoader(); }, 600);
        earthWrap.style.animation = 'earthIn 2.4s cubic-bezier(.18,.89,.32,1.08) forwards';
        earthWrap.style.opacity = '1';
        // Reveal slider after earth starts animating in
        sliderWrap.style.display = 'block';
      }, 320);

      // ── Live CO₂ refresh — called after every activity log ──────────────────
      function refreshCo2() {
        co2 = getTodayKg();
        document.getElementById('header-co2').textContent = co2.toFixed(1) + ' / ' + DAILY_BUDGET + ' kg CO₂e today';
        if (earthScene) earthScene.updateCarbonFrac(frac());
        updateAtmosLegend();
        renderCo2Widget();
      }

      // Expose so activity log panel can call it after adding an entry
      window._ecoRefreshCo2 = refreshCo2;
      window._ecoAuthUser = authUser;
      // Also expose refreshCo2 to activity log panel (registered early)
      // Already set below after refreshCo2 is defined — this is a safety duplicate

      // Also listen for custom event (fired by activity log panel)
      window.addEventListener('eco:activityLogged', refreshCo2);

      // ── Initial legend render ──────────────────────────────────────────────────
      updateAtmosLegend();

    }


  </script>
</body>
